   why the signal meter and clock were wasting it. Neither told anyone
   anything: the bars were decorative and the clock is already on the
   phone that is displaying it.

   What replaces them is the object that belongs in that corner on real
   hardware: an annunciator. A dark housing with a legend that reads as
   LIT rather than printed, so it is unmistakably a control that wants
   pressing rather than a label. It is the only lit legend on the
   panel, and now it is on every screen instead of just the home face.

   The lamp breathes. Annunciators blink to claim attention and this is
   the one element on the panel whose whole job is to be noticed —
   slow enough to read as an idle instrument, not an alert.
   ══════════════════════════════════════════════════════════════════ */

.annun {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 13px 7px 11px;
  border-radius: 7px;
  /* Two layers: a specular sheen parked off the left edge, and the
     housing itself. The sheen is a BACKGROUND rather than a pseudo
     element because backgrounds are clipped to the border box for
     free — an overlay would have needed overflow:hidden, and that
     would have clipped the ::after that extends the tap target. */
  background:
    linear-gradient(100deg,
      rgba(255,226,178,0) 0%,
      rgba(255,226,178,.26) 32%,
      rgba(255,249,229,.66) 50%,
      rgba(255,226,178,.26) 68%,
      rgba(255,226,178,0) 100%) -62% 0 / 55% 100% no-repeat,
    linear-gradient(176deg, #3c3f39 0%, #242622 58%, #171815 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 0 -1px 0 rgba(0,0,0,.6),
    inset 0 0 14px rgba(255,150,40,.1),
    0 1px 0 rgba(255,255,255,.7),
    0 0 0 1px rgba(0,0,0,.35);
  transition: transform var(--t-tap) var(--ease-mech),
              box-shadow var(--t-tap) var(--ease-mech);
}
.annun:hover {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -1px 0 rgba(0,0,0,.6),
    inset 0 0 18px rgba(255,150,40,.2),
    0 1px 0 rgba(255,255,255,.7),
    0 0 0 1px rgba(0,0,0,.4);
}
.annun:active {
  transform: translateY(1.5px);
  box-shadow: inset 0 2px 5px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.4);
}

/* The housing sits 33px tall to fit the rail, which is under the 44px
   a thumb wants. The hit area is extended past the visible edge rather
   than inflating the object — the rail has no room to grow. */
.annun::after { content: ""; position: absolute; inset: -7px -6px; }

.annun-lamp {
  flex: 0 0 auto;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--p-hot);
  box-shadow: 0 0 6px 1px rgba(255,170,60,.85), inset 0 1px 1px rgba(255,255,255,.55);
  animation: annunBreathe 3.4s var(--ease-io) infinite;
}
@keyframes annunBreathe {
  0%, 100% { opacity: 1;   box-shadow: 0 0 6px 1px rgba(255,170,60,.85), inset 0 1px 1px rgba(255,255,255,.55); }
  50%      { opacity: .58; box-shadow: 0 0 3px 0 rgba(255,170,60,.4),  inset 0 1px 1px rgba(255,255,255,.3); }
}

.annun-line {
  min-width: 0;
  font-family: var(--face-panel);
  font-weight: 800; font-stretch: 108%;
  font-size: .72rem;
  letter-spacing: .04em;
  white-space: nowrap;
  /* Lit, not printed: the glow is what separates a legend from a label. */
  color: #ffe6bd;
  text-shadow: 0 0 8px rgba(255,150,40,.75), 0 0 2px rgba(255,190,90,.6);
}

/* ── The self test ────────────────────────────────────────────────
   Once every thirty seconds the annunciator runs what an instrument
   would call a lamp test: the legend flares to full, the housing takes
   a specular pass, and the lamp goes hard bright before settling back
   to its idle breathing.

   Thirty seconds is the point of it. A control that glows constantly
   stops being a signal and becomes texture — the eye filters it out
   inside a minute. One pass, well apart from the last one, keeps its
   meaning: something over here is worth your attention.

   The whole cycle is under a second and a half, and it stops for good
   once the window has actually been opened. */
.annun.is-flare {
  animation:
    annunSweep 1150ms var(--ease-io),
    annunSwell 1350ms var(--ease-out);
}
@keyframes annunSweep {
  0%   { background-position: -62% 0, 0 0; transform: none; }
  16%  { transform: translateY(-1.5px) scale(1.03); }
  48%  { transform: translateY(0) scale(1.006); }
  100% { background-position: 168% 0, 0 0; transform: none; }
}
@keyframes annunSwell {
  0%, 100% {
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(0,0,0,.6),
      inset 0 0 14px rgba(255,150,40,.1),
      0 1px 0 rgba(255,255,255,.7), 0 0 0 1px rgba(0,0,0,.35);
  }
  20% {
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.3), inset 0 -1px 0 rgba(0,0,0,.6),
      inset 0 0 26px rgba(255,165,55,.5),
      0 1px 0 rgba(255,255,255,.7), 0 0 0 1px rgba(0,0,0,.4),
      0 0 20px 3px rgba(255,150,40,.42);
  }
  58% {
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.2), inset 0 -1px 0 rgba(0,0,0,.6),
      inset 0 0 18px rgba(255,155,45,.24),
      0 1px 0 rgba(255,255,255,.7), 0 0 0 1px rgba(0,0,0,.36),
      0 0 9px 1px rgba(255,150,40,.16);
  }
}
.annun.is-flare .annun-line { animation: annunLegend 1250ms var(--ease-out); }
@keyframes annunLegend {
  0%, 100% { color: #ffe6bd; text-shadow: 0 0 8px rgba(255,150,40,.75), 0 0 2px rgba(255,190,90,.6); }
  18%      { color: #fffdf7; text-shadow: 0 0 18px rgba(255,178,78,1), 0 0 6px rgba(255,226,160,.98), 0 0 34px rgba(255,140,30,.62); }
  56%      { color: #fff3dd; text-shadow: 0 0 12px rgba(255,165,60,.88), 0 0 3px rgba(255,205,120,.8); }
}
.annun.is-flare .annun-lamp { animation: annunLampTest 1250ms var(--ease-out); }
@keyframes annunLampTest {
  0%, 100% { opacity: 1; box-shadow: 0 0 6px 1px rgba(255,170,60,.85), inset 0 1px 1px rgba(255,255,255,.55); }
  18%      { opacity: 1; box-shadow: 0 0 14px 4px rgba(255,190,90,1), inset 0 1px 1px rgba(255,255,255,.9); }
}
@media (prefers-reduced-motion: reduce) {
  .annun-lamp, .hero-pip { animation: none; }
  .doss-in { animation: none; }
  .annun.is-flare,
  .annun.is-flare .annun-line,
  .annun.is-flare .annun-lamp { animation: none; }
}

/* ── Stats inside the window ──/* ── Stats inside the window ──────────────────────────────────────
   Two by two, because four tiles in a row on a phone turns every
   number into two digits and a wrapped label. */
/* ── The dossier ───────────────────────────────────────────────────
   Hindsight, and the only place left where the panel broke its own
   rule. The credential card held four stat tiles, three paragraphs, a
   footnote and a closing offer in a box 520px tall — about 860px of
   content — so the one screen carrying the EXPERIENCE half of a
   business card was also the one screen you had to scroll. A modal
   with a scrollbar in it is the least app-like object it is possible
   to put on a page, and it was sitting on the most important content.

   Deleted and rebuilt as three designed pages, turned with the same
   deck keys that page the bank list and the search results — so the
   thing a visitor already learned twice works here too, and nothing
   about it has to be explained. Numbers first, because a stranger
   believes a figure before a sentence; then the statement in his own
   words; then what he actually offers, ending on the one control the
   whole page exists to reach.

   Pages are authored rather than measured. A measured break would put
   a heading alone at the foot of page two — this content has three
   arguments in it and each one gets a page. Robustness comes from the
   fit ladder instead: if a page runs long on a short phone, the type
   steps down rather than the box growing a scrollbar. */
#why-face {
  display: flex;
  flex-direction: column;
  height: min(56dvh, 452px);
  max-height: none;
  overflow: hidden;          /* the rule, enforced rather than hoped for */
}
.doss-head { flex: 0 0 auto; }
.doss {
  display: flex;
  flex-direction: column;
  gap: clamp(9px, 1.5vh, 13px);
  flex: 1 1 auto;
  min-height: 0;
  margin-top: clamp(11px, 1.8vh, 16px);
  overflow: hidden;
}
.doss > .is-off { display: none; }
.doss-in { animation: dossIn 340ms var(--ease-out) both; }
@keyframes dossIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}
/* The ladder is the backstop, not the mechanism. Paging handles a
   section that is too long; this handles a single BLOCK that is too
   long — one paragraph taller than the whole stage, which no amount of
   paging can fix because there is nowhere to break it. */
.doss.dfit-1 .card-sub  { font-size: .76rem; line-height: 1.52; }
.doss.dfit-1 .stat      { padding: 9px 10px 10px; gap: 3px; }
.doss.dfit-1 .why-foot  { font-size: .56rem; line-height: 1.5; }
.doss.dfit-2 .card-sub  { font-size: .7rem;  line-height: 1.42; }
.doss.dfit-2 .stat-ico  { display: none; }
.doss.dfit-2 .why-ast   { font-size: .56rem; line-height: 1.5; }

/* The rail under the screen: which page, and the keys to turn it. The
   console puts its controls on chassis below the glass, so this card
   does too. */
.doss-rail {
  display: flex; align-items: center; gap: 12px;
  margin: -2px 13px 0;
  padding: 0 3px 10px;
}
.doss-tab {
  flex: 1 1 auto; min-width: 0;
  font-family: var(--face-data);
  font-size: .56rem; font-weight: 600;
  letter-spacing: .26em; margin-right: -.26em;
  text-transform: uppercase;
  color: var(--ink-70);
  text-shadow: 0 1px 0 var(--etch);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-variant-numeric: tabular-nums slashed-zero;
}
.doss-rail .deck { flex: 0 0 auto; }

/* The close of the argument is a control, not a full stop. The sheet
   used to end on a footnote and leave the visitor to find their own
   way back to a phone number. */
.doss-cta {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  margin-top: auto;
  padding: 12px 18px;
  border-radius: 11px;
  font-family: var(--face-panel);
  font-weight: 800; font-stretch: 112%;
  font-size: .8rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tube-deep);
  background: linear-gradient(180deg, var(--p-hot), var(--p));
  box-shadow: 0 0 22px -6px rgba(255,179,71,.8), inset 0 1px 0 rgba(255,255,255,.6);
  transition: transform var(--t-tap) var(--ease-mech),
              box-shadow var(--t-tap) var(--ease-mech);
}
.doss-cta:hover { box-shadow: 0 0 28px -4px rgba(255,179,71,.95), inset 0 1px 0 rgba(255,255,255,.7); }
.doss-cta:active { transform: translateY(1px); }
.doss-cta svg { width: 15px; height: 15px; stroke-width: 2.4; }

.why-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.stat {
  position: relative;
  display: flex; flex-direction: column;
  gap: 5px;
  padding: 11px 12px 12px;
  border-radius: 10px;
  background: rgba(255,179,71,.055);
  box-shadow: inset 0 0 0 1px rgba(255,179,71,.2);
}
.stat-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.stat-ico { width: 17px; height: 17px; color: var(--p-mid); flex: 0 0 auto; }
.stat-stars { display: inline-flex; gap: 1.5px; }
.stat-stars svg { width: 9px; height: 9px; fill: var(--p-hot); }
.stat-n {
  font-family: var(--face-panel);
  font-weight: 800; font-stretch: 112%;
  font-size: clamp(1.05rem, 4.4vw, 1.3rem);
  line-height: 1;
  color: var(--p-hot);
  font-variant-numeric: tabular-nums slashed-zero;
}
.stat-l {
  font-family: var(--face-data);
  font-size: .58rem;
  line-height: 1.4;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--p-mid);
}
.why-foot {
  margin: 11px 0 0;
  font-family: var(--face-data);
  font-size: .6rem;
  line-height: 1.6;
  color: var(--p-dim);
}

/* ── The closing offer ────────────────────────────────────────────
   Last thing read, so it gets a rule above it and a little more weight
   than the footnote it follows — this is the sentence that answers
   "what happens if it goes wrong", which is the last thing anyone
   wants to know before they get in touch. */
.why-offer {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 7px;
  margin-bottom: 9px;
}
.why-offer-lead {
  font-family: var(--face-data);
  font-size: .64rem;
  letter-spacing: .04em;
  color: var(--p);
}
.why-chip {
  display: inline-flex; align-items: baseline; gap: 1px;
  padding: 5px 10px 5px 11px;
  border-radius: 999px;
  font-family: var(--face-panel);
  font-weight: 700; font-stretch: 106%;
  font-size: .7rem;
  letter-spacing: .03em;
  color: #ffe6bd;
  background: rgba(255,179,71,.1);
  box-shadow: inset 0 0 0 1px rgba(255,179,71,.34);
}
.why-chip sup { font-size: .68em; color: var(--p-hot); }
.why-ast {
  margin: 0;
  font-family: var(--face-data);
  font-size: .62rem;
  line-height: 1.65;
  color: var(--p-mid);
}
.why-ast b { color: var(--p-hot); font-weight: 600; }

/* ═══════════════════════════════════════════════════════════════════
   THE TUNER (phone only)

   A phone gets one screen per category, not two. The monitor holds the
   readout and a single service card sits under it on a horizontal
   snap track — swipe the card, the monitor follows. It is the same
   relationship a tuning dial has to a display: the strip selects, the
   screen reports.

   This replaces the list → detail drill entirely. The old flow cost a
   tap to enter a service and a tap to leave it, and every one of those
   round trips threw away the reader's place in the list. Here there is
   no place to lose: the current service IS the card in the middle, and
   the next one is already half visible at the edge.

   Neighbours peek from behind the arrow keys so the strip reads as a
   continuous reel rather than a single card that mysteriously changes.
   ══════════════════════════════════════════════════════════════════ */

.tuner { display: none; }

.tuner-track {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: stretch;
  gap: 10px;
  /* The one scroll surface left on the phone, and it is a control
     rather than a document — a viewport-sized reel that happens to be
     driven by the same gesture people already use on a carousel.
     Native snap is used instead of a transform pager because momentum,
     rubber-band and mid-flick reversal all come free and none of them
     are worth reimplementing badly. */
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  /* Sized so the NEXT card clears the arrow key rather than hiding
     behind it — about 26px of it stays visible, which is the whole
     reason the reel reads as a reel. */
  padding-inline: 58px;
  scroll-padding-inline: 58px;
}
.tuner-track::-webkit-scrollbar { display: none; }

.tcard {
  position: relative;
  flex: 0 0 calc(100% - 138px);
  min-width: 0;
  scroll-snap-align: center;
  scroll-snap-stop: always;
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas: "sec price" "name price" "note note";
  align-content: center;
  gap: 2px 12px;
  padding: 12px 15px 13px 20px;
  text-align: left;
  border-radius: 12px;
  background: linear-gradient(177deg, #fbfcf8 0%, var(--mag) 62%, var(--mag-mid) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    0 3px 0 var(--mag-lo),
    0 4px 0 rgba(0,0,0,.2),
    0 7px 12px rgba(0,0,0,.2);
  transition: box-shadow var(--t-quick) var(--ease-out), opacity var(--t-quick) linear;
}
/* The active card is the one the monitor is reporting, so it carries
   the bank's lamp down the edge exactly like the readout's own rule. */
.tcard::before {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 5px;
  border-radius: 12px 0 0 12px;
  background: var(--c, var(--anod));
  box-shadow: inset -1px 0 1px rgba(0,0,0,.18);
  opacity: .3;
  transition: opacity var(--t-quick) linear;
}
.tcard[aria-current="true"]::before { opacity: 1; }
/* Off-centre cards sit back rather than competing with the live one. */
.tcard:not([aria-current="true"]) { opacity: .5; }

.tcard-sec {
  grid-area: sec;
  font-family: var(--face-data);
  font-size: .54rem; font-weight: 600;
  letter-spacing: .22em; text-transform: uppercase;
  color: var(--ink-70);
}
.tcard-sec:empty { display: none; }
.tcard-name {
  grid-area: name;
  font-weight: 700; font-stretch: 106%;
  font-size: .95rem; line-height: 1.18;
  color: var(--ink);
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.tcard-note {
  grid-area: note;
  margin-top: 3px;
  font-family: var(--face-data);
  font-size: .63rem; line-height: 1.35;
  color: var(--ink-70);
  overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.tcard-price {
  grid-area: price;
  align-self: center;
  font-family: var(--face-data);
  font-size: .66rem; font-weight: 600;
  white-space: nowrap;
  color: var(--ink);
  font-variant-numeric: tabular-nums slashed-zero;
}
/* A folder is not a service. The chevron says the card opens rather
   than requests, before the monitor has to explain it. */
.tcard.is-group .tcard-price::after {
  content: " ›";
  font-size: .8rem;
  color: var(--ink-70);
}

.tuner-arrow {
  position: absolute;
  top: 50%;
  z-index: 2;
  width: 44px; height: 54px;
  transform: translateY(-50%);
}
.tuner-arrow[data-dir="-1"] { left: 0; }
.tuner-arrow[data-dir="1"]  { right: 0; }

/* ═══ RESPONSIVE ════════════════════════════════════════════════════
   The original's breakpoints targeted .menu-grid (which does not
   exist) and applied horizontal scroll to .service-bank while the
   buttons sat in an inner column-flex wrapper — so neither fired.
   Here the rules target the elements that actually scroll.
   ══════════════════════════════════════════════════════════════════ */

/* ── Tablet: stack the workspace, bank becomes a channel rail ────── */
@media (max-width: 940px) {
  .workspace { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr); }

  .bank-list {
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    /* Without min-width:0 a scrollable flex/grid child is sized by its
       CONTENT, so the rail grew to 2787px, stretched .view past the
       chassis, and got clipped — overflow-x never engaged and channels
       4+ were unreachable. Same failure the original file had. */
    min-width: 0;
    padding: 4px 2px 10px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 22px), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 22px), transparent 100%);
    scroll-snap-type: x proximity;
  }
  .bank-list::-webkit-scrollbar { height: 5px; width: auto; }

  .chan {
    width: 205px;
    scroll-snap-align: start;
    padding: 16px 13px 11px;
    animation-name: chanInUp;
  }
  .chan::before { inset: 0 0 auto 0; width: auto; height: 5px; border-radius: 9px 9px 0 0; }
  .chan[aria-current="true"] { transform: translateY(-3px); }
  .chan[aria-current="true"]::before { width: auto; height: 7px; }
  .chan:hover { transform: translateY(-3px); }
  .chan.is-up:hover { transform: translateY(-3px); }
  .chan.is-up { margin: 0 3px 0 0; }

  @keyframes chanInUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
}

/* ── Phone ───────────────────────────────────────────────────────────
   The desktop is a rack instrument: wide, screen right, keys left, all
   of it visible because a bench has room. A phone is not a small bench,
   so this is a different machine in the same family — a HANDHELD FIELD
   UNIT. Tall body, screen on top, keypad underneath, one job on screen
   at a time. Everyone has held one of these, which is the point.

   The old phone layout inherited the tablet rule that turns the channel
   list into a horizontally-scrolling rail. That is a poor way to read
   thirteen services and an actively bad way to read twenty-one: you
   cannot scan it, you cannot see how many there are, and reaching the
   last one costs twenty swipes. So the category screen becomes two
   stages — pick from a full-height list, then read the channel on a
   full-height screen. The back key walks the stack.
   ══════════════════════════════════════════════════════════════════ */
@media (max-width: 620px) {
  :root { --rail: 52px; --gap: 13px; --bezel: 13px; }

  /* place-items:center on an auto-height row makes .stage's height:100%
     circular, which is why the panel used to re-measure every time the
     browser chrome hid. A block body with an explicit dvh shell
     resolves in one pass. */
  body { display: block; padding: 0; }
  .stage {
    width: 100%;
    max-width: none;
    height: 100vh;
    height: 100dvh;
    max-height: none;
    perspective: none;
  }
  /* The shell is sealed. Every surface inside it is measured and
     paged, so any scroll that appears here is a layout bug rather
     than a feature — and this makes it fail loudly instead of
     quietly absorbing the mistake. */
  html, body {
    overflow: hidden;
    overscroll-behavior: none;
    height: 100%;
    position: fixed;
    inset: 0;
  }
  /* Same automatic-minimum trap as the views, one level up: the brow's
     silkscreen plate set a min-content floor the implicit column had to
     honour, so the whole chassis sat 5px wider than a 360px screen and
     the right edge of every rail was clipped. */
  .chassis { grid-template-columns: minmax(0, 1fr); }
  .brow, .base, .bay { min-width: 0; }
  .plate, .brow-telemetry, .serial { min-width: 0; }
  .console { transform: none; }
  .chassis { border-radius: 0; box-shadow: none; }
  /* Screws belong to a panel you unbolt on a bench. A field unit has a
     bumper instead, so the corner hardware goes and the case arrives. */
  .screw, .sheen { display: none; }

  .stage::before {
    content: "";
    position: fixed; inset: 0;
    z-index: 6;
    pointer-events: none;
    box-shadow:
      inset 0 0 0 4px #1e211b,               /* overmold */
      inset 0 0 0 5px rgba(0,0,0,.55),       /* parting line */
      inset 0 0 0 6px rgba(255,255,255,.07), /* light on the inner lip */
      inset 0 0 26px rgba(0,0,0,.3);         /* the case shades the panel */
  }
  /* Grip texture down the two edges your fingers actually land on. */
  .stage::after {
    content: "";
    position: fixed;
    top: 22%; bottom: 22%; left: 0; right: 0;
    z-index: 7;
    pointer-events: none;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 2px, transparent 2px 6px) left  / 4px 100% no-repeat,
      repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 2px, transparent 2px 6px) right / 4px 100% no-repeat;
  }

  /* ── Rails ──────────────────────────────────────────────────────
     Both hug the notch and the home indicator rather than sitting
     under them; viewport-fit=cover is already declared in the head. */
  /* Two columns, and the first one is allowed to be narrower than its
     contents. With `auto` the brand plate claimed its max-content width
     and pushed the annunciator up to 69px off the right edge of a 360px
     screen, where the chassis quietly clipped it. */
  .brow {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }
  .mark { min-width: 0; gap: 9px; }
  /* One line on the badge. The model was competing with the name for a
     rail it was already sharing with the annunciator, and the brand is
     the string here that may never be abbreviated — so the model is the
     one that goes, rather than being kept as a truncated version of
     itself. It stays in the markup and on the desktop plate, where
     there is room to read it.

     Everything that existed only to make two lines fit goes with it:
     the column stack, the shrink rules, the ellipsis. The lamp cull
     below stays — I checked rather than assumed, and it is still
     load-bearing. */
  .plate { min-width: 0; flex: 0 0 auto; }
  .plate-model { display: none; }
  .plate-name {
    flex: 0 0 auto;
    white-space: nowrap;
    overflow: visible;
    font-size: clamp(.88rem, 3.6vw, .95rem);
    letter-spacing: .08em;
  }

  /* The cluster runs a touch tighter up here — it reads as a row of
     pilot lamps either way. */
  .lamps { gap: 5px; }
  .lamps .lamp { width: 8px; height: 8px; }
  /* At 8px lamps and 5px gaps the cluster costs 56px of rail. The badge
     needs about 128px and the annunciator takes 125, which puts the
     crossover at 344px: above it both fit, below it one of them is
     getting clipped. It will not be the brand. Removed cleanly rather
     than left to clip into a row of half-lamps, and it is the right
     thing to drop — aria-hidden, and every lamp state up here is
     repeated by the key lamps on the face below. */
  @media (max-width: 344px) {
    .brow .lamps { display: none; }
    .mark { gap: 0; }
  }
  /* The vent was hidden to buy width the brow did not need. It is the
     one piece of texture up there, and 1fr lets it yield to the plate
     on a narrow screen rather than fighting it. */
  .brow .vent { display: none; }
  .plate {
    padding: 4px 10px 5px;
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,.34),
      inset 0 -1px 0 rgba(255,255,255,.55),
      0 1px 0 rgba(255,255,255,.85);
  }
  .telemetry { justify-self: end; gap: 10px; }
  .telemetry .clock { display: none; }

  /* ── The base rail becomes the dock ─────────────────────────────
     Keyboard hints and the serial number are bench furniture; neither
     survives contact with a thumb. What replaces them is the only
     thing a phone can do that a desktop cannot. */
  .base {
    gap: 8px;
    padding: 9px max(11px, env(safe-area-inset-right))
             calc(10px + env(safe-area-inset-bottom)) max(11px, env(safe-area-inset-left));
  }
  .hints, .serial { display: none; }
  .dock { display: flex; flex: 1; gap: 8px; min-width: 0; }
  /* Audio survives as the switch alone. The label was the only part
     that needed the width, and the track already reads as on or off. */
  .pwr {
    flex: 0 0 auto;
    gap: 0;
    width: 46px; height: 46px;
    padding: 0;
    border-radius: 10px;
    justify-content: center;
    align-items: center;
  }
  .pwr-label { display: none; }

  /* ── Audio: a speaker, not a switch ──────────────────────────────
     A track and knob only says which way it is thrown; what it MEANS
     is carried by the legend beside it, and the phone hides legends to
     buy the rail its width back. So the throw was readable and the
     state was not.

     A speaker states its own condition. The cone is common to both
     positions and never moves — only the mark to the right of it
     changes, so the swap reads as one thing changing rather than two
     icons alternating. Waves for live, a cross for muted.

     And the well answers with it, because a glyph alone is a small
     thing to hang a state on at arm's length: muted is dim ink in a
     dead recess, live is full ink in a recess lit by the same green
     the switch used to throw to. Two looks, at a glance, without
     having to resolve which side a knob is sitting on. */
  #pwr .pwr-track { display: none; }
  #pwr .pwr-ico { display: block; width: 21px; height: 21px; }
  #pwr[aria-pressed="false"] .ico-wave { display: none; }
  #pwr[aria-pressed="true"]  .ico-mute { display: none; }
  #pwr {
    transition:
      color var(--t-quick) linear,
      background var(--t-quick) linear,
      box-shadow var(--t-quick) var(--ease-out);
  }
  #pwr[aria-pressed="true"] {
    color: var(--ink);
    background: rgba(79,178,108,.13);
    box-shadow:
      inset 0 1px 2px rgba(0,0,0,.16),
      inset 0 0 0 1px rgba(79,178,108,.42),
      0 0 9px -2px rgba(79,178,108,.5);
  }
  #pwr[aria-pressed="true"] .pwr-ico { filter: drop-shadow(0 0 4px rgba(79,178,108,.55)); }

  .lang { width: auto; min-width: 46px; padding: 0 11px; }
  .lang .pwr-track { display: none; }
  .lang .lang-code {
    display: block;
    font-family: var(--face-data);
    font-size: .68rem; font-weight: 700; letter-spacing: .08em;
    color: var(--ink);
  }

  .view {
    padding: 13px max(13px, env(safe-area-inset-right))
             16px max(13px, env(safe-area-inset-left));
  }
  /* Spanish runs about a fifth longer than English, and the phone is
     where that lands: "Eliminación de virus y malware" against a 300px
     measure rags badly. The document already carries the right `lang`,
     so the browser can break these correctly — it just has to be asked,
     and only here, where the column is tight enough to need it. */
  .tube-body, .card-sub, .bank-empty, .chan-name, .res-name {
    hyphens: auto;
    -webkit-hyphens: auto;
  }
  .legend { font-size: .56rem; letter-spacing: .26em; margin-bottom: 9px; }
  .legend::after { margin-left: -.26em; }   /* re-cut for the tighter track */
  .legend::before {
    content: "";
    order: 2;
    flex: 1;
    height: 9px;
    margin-left: 2px;
    border-radius: 2px;
    background: repeating-linear-gradient(90deg, transparent 0 3px, var(--anod-lo) 3px 5px);
    box-shadow: inset 0 1px 1px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.75);
    opacity: .55;
  }

  /* ══ HOME ══════════════════════════════════════════════════════
     Readout on top, finder and keys underneath. The tube states who
     this is; the finder is for people who already know what they want;
     the keys are for people who don't. Three things, in the order a
     visitor needs them.

     Rows are auto / 1fr rather than two flexible tracks. A fractional
     first row leaves the leftover space wherever the browser feels
     like putting it — on a tall phone that was a hero taking 38% of
     the screen, on a short one a dead band above the dock. Sizing the
     tube from the viewport and handing every remaining pixel to the
     keys makes both ends predictable: the screen scales with the
     phone, and the keys always finish flush against the dock. */
  #view-home {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    gap: 12px;
  }
  .view#view-home { overflow: hidden; }
  #view-home .m-readout { grid-column: 1; grid-row: 1; }
  #view-home .m-banks   { grid-column: 1; grid-row: 2; }
  #view-home .hero { flex: 0 0 auto; height: clamp(148px, 24dvh, 240px); }
  .hero .tube-face { padding: 17px 17px 18px; }
  .hero-kicker { font-size: .58rem; letter-spacing: .26em; }
  .hero-line {
    font-size: clamp(1.55rem, 8.4vw, 2.4rem);
    letter-spacing: .004em;
    margin: 10px 0 9px;
  }
  .hero-note { font-size: .72rem; line-height: 1.5; letter-spacing: .05em; }
  .hero-strip { margin-top: 11px; padding-top: 9px; }
  .hcell { padding-left: 13px; }
  .hcell-n { font-size: 1rem; }
  .hcell-l { font-size: .5rem; letter-spacing: .2em; margin-right: -.2em; }

  /* The finder is the first control a thumb meets, so it gets a real
     44px-plus target and type big enough that iOS will not zoom the
     viewport when it takes focus. Anything under 16px triggers that
     zoom, and the page never zooms back out. */
  .finder { margin-bottom: 10px; padding: 0 10px 0 12px; }
  .finder-in { padding: 14px 0; font-size: 16px; letter-spacing: .01em; }
  .finder-ico { width: 16px; height: 16px; }
  .finder-x { width: 30px; height: 30px; }

  .results {
    padding: 10px; gap: 8px; margin-bottom: 0;
    overflow: hidden;
    flex: 1 1 auto; min-height: 0;
    /* Rows are sized by content and the page engine decides how many
       fit, so the well never needs to know what is in it. */
    justify-content: flex-start;
  }
  /* Adjacent to #results in the markup, so it can key off the same
     [hidden] the finder already toggles — no extra state to keep in
     sync, and it costs nothing when nobody is searching. */
  #results:not([hidden]) + #deck-home {
    display: flex; align-items: center; gap: 10px; margin-top: 9px;
  }
  .res { padding: 13px 14px 14px 20px; }
  .res-name { font-size: .88rem; }
  .res-path, .res-price { font-size: .66rem; }

  /* Keys go two-up. Four banks and the contact bar then land above the
     fold together, which is the whole argument for the grid. */
  /* A deeper well and a taller key edge. Thumbs deserve more travel
     than a mouse does, and the shadow is what sells the press. */
  /* The keys take the height the finder and legend do not, but they
     stop growing at 150px. Past that a tile is mostly the gap between
     a top-left icon and a bottom-left label, which reads as a rendering
     bug rather than a generous control. The slack a tall phone leaves
     over becomes margin inside the well instead, which is what a
     recessed panel is supposed to look like. */
  .keypad {
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: minmax(102px, 150px);
    /* SAFE centring, not centring. See the soft-keyboard note below:
       plain `center` sends half of any overflow upward, and upward is
       where the search field lives. `safe` falls back to start the
       moment the contents stop fitting, so nothing can ever travel out
       of the top of this well again. */
    align-content: safe center;
    flex: 1 1 auto;
    min-height: 0;
    overflow: visible;
    margin-bottom: 0;
    gap: 9px;
    padding: 10px;
    box-shadow:
      inset 0 4px 11px rgba(0,0,0,.4),
      inset 0 -1px 0 rgba(255,255,255,.28),
      0 1px 0 rgba(255,255,255,.7);
  }

  /* ── The soft keyboard ────────────────────────────────────────────
     `interactive-widget=resizes-content` is declared in the head, which
     means that the moment the finder takes focus the panel is handed
     whatever the keyboard leaves it — on a 390 x 844 phone that is
     about 508px instead of 844, and the bay drops from roughly 690px
     to 388px.

     The well is sized to hold two rows of at least 102px: 233px with
     its gap and padding. Add the finder and its legend and the module
     needs about 316px, against 199px left. Overflowing by 117px was
     survivable; centring that overflow was not, because centring puts
     half of it — 58px of key — directly on top of the legend and the
     search field the visitor is typing into.

     Three measures, in order of how much each one buys:

       safe centring   above. The actual fix: overflow can now only ever
                       go downward, so the field is never covered.
       the readout     collapses while the field has focus. Nobody is
                       reading the tube with a keyboard over it, and it
                       is worth 148px — on most phones, the entire
                       deficit, so nothing has to overflow at all.
       the well scrolls if the phone is small enough that even that is
                       not enough, rather than hiding two banks behind
                       the dock. Only while focused: a scroll container
                       clips ink overflow, and the key skirts standing
                       proud of the recess are the whole point of how
                       this well looks at rest.

     Typing takes over from here — the first character swaps the keys
     for results, which have always been paginated to the height they
     are actually given and re-paginate on resize. */
  #view-home:has(#find:focus) { row-gap: 0; }
  #view-home:has(#find:focus) .m-readout { display: none; }
  #view-home:has(#find:focus) .keypad {
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-bottom: 16px;        /* the last skirt, before the clip */
    scroll-padding: 10px;
  }
  /* Call, text and email are permanently docked at the foot of the
     screen now, and the card is one tap from there. A second contact
     control on the home screen was the same offer twice — and it cost
     88px of the fold that the keys wanted. */
  .contact-slot { display: none; }

  /* The plate is the last thing on the panel before the dock, which
     puts it squarely in the thumb arc and makes it the natural fourth
     stop after readout, finder and keys. It takes the slack the keypad
     was centring away, so nothing else moves to make room. */
  .why-slot { margin-top: 9px; }
  .btn-why { padding: 11px 12px 11px 14px; }
  .why-line { font-size: .86rem; }
  .why-sub { font-size: .59rem; }
  /* A search replaces the keys, and the plate goes with them — it
     belongs to the home face, not to a list of results. */
  #keypad[hidden] ~ .why-slot { display: none; }

  .annun { padding: 6px 10px 6px 9px; gap: 7px; border-radius: 6px; }
  .annun-line { font-size: .66rem; letter-spacing: .03em; }
  .annun-lamp { width: 7px; height: 7px; }

  .why-stats { gap: 7px; }
  #why-face { height: min(58dvh, 430px); }
  .doss-rail { margin: -2px 11px 0; gap: 9px; }
  .doss-tab { font-size: .52rem; letter-spacing: .18em; margin-right: -.18em; }
  .doss-cta { padding: 13px 16px; font-size: .76rem; }
  .stat { padding: 10px 11px 11px; }
  /* The credential sheet carries more prose than the contact card, so
     it takes the extra height rather than making people scroll for it. */
  #why-card { max-height: 93dvh; }

  /* Tiles, not rails: icon parks at the top, the name sits on the
     baseline, index and lamp take the free corners. Flex rather than a
     re-templated grid, so the base rule's areas cannot half-apply. */
  .key {
    --edge: 6px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-end;
    gap: 6px;
    padding: 13px;
    min-height: 102px;
  }
  /* The base rule sets align-self:center for the grid layout; in a
     column flex that becomes horizontal centring, which would float
     the icon away from the left-aligned name. */
  .key .key-icon  { width: 30px; height: 30px; margin-bottom: auto; align-self: flex-start; }
  .key .lamp      { position: absolute; top: 13px; right: 13px; width: 10px; height: 10px; }
  .key .key-idx   { position: absolute; bottom: 13px; right: 12px; font-size: .64rem; }
  .key .key-name  { font-size: .82rem; line-height: 1.16; padding-right: 24px; }
  .key .key-count { font-size: .6rem; margin-top: 3px; }

  /* ══ CATEGORY — two stages in one screen ═══════════════════════
     .bank and .tube are stacked in the same grid cell and swapped by
     [data-stage]. No attribute means list, so a mis-timed route or a
     stale attribute can never show both at once. */
  /* One screen per category: bar, monitor, request key, tuner. The
     vertical channel list and its page deck belong to the desktop
     layout now — on a phone the tuner IS the list. */
  #view-cat {
    /* minmax(0,1fr), never plain 1fr: the automatic min-content floor on
       a 1fr track let the tuner reel size the column, which computed to
       1512px inside a 390px view and pushed the bar and the monitor off
       the right edge. */
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    gap: 9px;
    overflow: hidden;
    padding-bottom: 11px;
  }
  /* .workspace stays a real box and simply becomes the monitor's row.
     Dissolving it with display:contents pushed .cat-bar and .tube into
     the grid the desktop two-column layout had placed them in, which
     put the readout above the bar and stretched the bar to 210px. */
  #view-cat .workspace {
    display: block;
    position: relative;
    min-height: 0;
    grid-template-columns: none;
  }
  #view-cat .bank,
  #view-cat .pager,
  #view-cat #deck-bank { display: none; }
  #view-cat .tube { height: 100%; }

  .tuner {
    position: relative;
    display: flex;
    align-items: stretch;
    /* Roughly a fifth of the bay, floored so a two-line service name
       never clips on a short phone. */
    height: clamp(92px, 16.5dvh, 128px);
    flex: 0 0 auto;
  }
  /* Pager and commit are both detail-stage furniture, hidden with the
     tube by the [data-stage] rules below. */
  #view-cat[data-stage="detail"] .pager { display: flex; align-items: center; gap: 10px; }
  .cat-bar { gap: 10px; }
  .cat-bar .vent { display: none; }
  .cat-name { font-size: 1.05rem; }
  .cat-kicker { font-size: .56rem; }
  .btn-back { padding: 11px 14px 11px 11px; }
  .btn-back kbd { display: none; }          /* no Esc key on a phone */
  #back-label { margin-right: 0; }          /* nothing left to butt against */

  .workspace {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr);
    min-height: 0;
  }
  .workspace > .bank, .workspace > .tube { grid-area: 1 / 1; min-height: 0; }

  #view-cat .tube { display: grid; }

  @keyframes stageFwd  { from { opacity: 0; transform: translateX(20px); }
                         to   { opacity: 1; transform: none; } }
  @keyframes stageBack { from { opacity: 0; transform: translateX(-14px); }
                         to   { opacity: 1; transform: none; } }
  #view-cat[data-active] .tube   { animation: stageFwd 300ms var(--ease-out) both; }
  #view-cat[data-active] .commit { animation: stageFwd 300ms 55ms var(--ease-out) both; }
  #view-cat[data-active] .tuner  { animation: stageFwd 300ms 85ms var(--ease-out) both; }
  #view-cat[data-stage="list"]   .bank   { animation: stageBack 250ms var(--ease-out) both; }

  /* ── Stage 1: the list ─────────────────────────────────────────
     Undoes the tablet rail. Every one of these is a reset of a rule
     from the 940px block, which still applies at this width. */
  .bank-list {
    flex-direction: column;
    overflow: hidden;
    scroll-snap-type: none;
    gap: 8px;
    padding: 4px 3px 18px;
    -webkit-mask-image: none;
            mask-image: none;
  }
  .bank-list::-webkit-scrollbar { width: 4px; height: auto; }
  .bank-head { font-size: .58rem; padding-bottom: 4px; }
  /* A sticky header would otherwise park on top of the row a keyboard
     or a deep link just scrolled to. */
  .bank-list { scroll-padding-top: 42px; }
  .bank-sec { font-size: .6rem; padding: 8px 11px 7px; top: -4px; }

  .chan {
    width: auto;
    scroll-snap-align: none;
    padding: 15px 15px 16px 22px;
    animation-name: chanIn;
  }
  .chan::before { inset: 0 auto 0 0; width: 5px; height: auto; border-radius: 9px 0 0 9px; }
  /* A full-width row that slides sideways when selected reads as a
     glitch, not a latch. The lit strip carries the state instead. */
  .chan[aria-current="true"] { transform: none; }
  .chan[aria-current="true"]::before { width: 6px; height: auto; }
  .chan.is-up { margin: 0 0 5px; }
  .chan.is-up:hover { transform: none; }
  .chan-name  { font-size: .92rem; line-height: 1.25; }
  .chan-note  { font-size: .68rem; }
  .chan-price {
    font-size: .64rem;
    padding: 3px 7px 4px;
    margin-top: -1px;
    border-radius: 4px;
    color: var(--ink);
    background: rgba(34,37,31,.085);
    box-shadow: inset 0 1px 1.5px rgba(0,0,0,.16), 0 1px 0 rgba(255,255,255,.7);
  }

  /* ── Stage 2: the readout ──────────────────────────────────────
     Full height, and the phosphor finally gets the room the type was
     drawn for. The face scrolls behind the fixed scanline glass. */
  #view-cat .tube-face { overflow: hidden; padding: 0 18px 20px; }

  /* A readout that overflows steps down one notch at a time rather
     than scrolling. Measured per channel, so the long descriptions
     tighten and the short ones keep the full size — the alternative
     was setting every channel to whatever the worst case needed. */
  #view-cat .tube-face.fit-1 .tube-body  { font-size: .78rem; line-height: 1.55; }
  #view-cat .tube-face.fit-1 .tube-title { font-size: 1.06rem; }
  #view-cat .tube-face.fit-2 .tube-body  { font-size: .73rem; line-height: 1.46; }
  #view-cat .tube-face.fit-2 .tube-title { font-size: .98rem; }
  #view-cat .tube-face.fit-2 .spec       { padding-block: 4px; }
  #view-cat .tube-face.fit-3 .tube-status { display: none; }

  /* The readout holds four things in a fixed-height box, so on a short
     phone something has to give. The note goes first, because it is the
     only line saying anything twice — the strip is already carrying the
     numbers and the keys are carrying the categories. Then the strip
     lies down into a single row of value-and-label pairs, which is a
     narrower thing rather than a smaller one. The name and the station
     never move: they are the reason the panel is here. */
  #view-home .tube-face.fit-1 .hero-line { font-size: clamp(1.3rem, 7.2vw, 1.95rem); }
  #view-home .tube-face.fit-1 .hero-note {
    display: -webkit-box; -webkit-box-orient: vertical;
    -webkit-line-clamp: 2; overflow: hidden;
  }
  #view-home .tube-face.fit-1 .hero-strip { margin-top: 9px; padding-top: 8px; }
  #view-home .tube-face.fit-2 .hero-note  { -webkit-line-clamp: 1; }
  #view-home .tube-face.fit-2 .hcell {
    flex-direction: row; align-items: baseline; gap: 6px;
    padding-left: 10px;
  }
  #view-home .tube-face.fit-2 .hcell-n { font-size: .9rem; }
  #view-home .tube-face.fit-2 .hcell-l { letter-spacing: .16em; margin-right: -.16em; }
  #view-home .tube-face.fit-3 .hero-note { display: none; }

  /* The price is the second thing anyone wants and it lived at the top
     of a scrolling column, so two paragraphs of description pushed it
     off the tube. Sticking it to the raster keeps the number on screen
     for the whole read — which is the entire point of showing it. */
  #view-cat .tube-eyebrow {
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 18px 0 9px;
    font-size: .62rem;
    letter-spacing: .2em;
    background: linear-gradient(180deg, var(--tube) 72%, rgba(18,14,8,0));
  }
  #view-cat .tube-eyebrow span:last-child {
    color: var(--p-hot);
    font-weight: 600;
  }
  #view-cat .tube-rule { margin-top: 0; }
  /* The two-line reserve exists to stop specs jumping as titles wrap.
     Here the face scrolls and the title is the first thing read, so
     the reserve is only dead space. */
  .tube-title { min-height: 0; font-size: clamp(1.45rem, 7.4vw, 2rem); }
  .tube-body  { font-size: .88rem; line-height: 1.7; max-width: none; }
  .spec       { font-size: .8rem; }
  .tube-status { font-size: .6rem; }

  .commit {
    padding-block: 15px;
    font-size: .8rem;
    letter-spacing: .16em;
  }
  .pg { width: 58px; height: 48px; }
  .pg-at { font-size: .66rem; }
}

/* ── Short viewports (landscape phone, small laptop) ─────────────── */
@media (max-height: 560px) and (min-width: 621px) {
  :root { --rail: 44px; }
  .view { padding-block: 14px; }
  .key { padding-block: 7px; gap: 1px 11px; }
  .key-icon { width: 22px; height: 22px; }
  /* minmax(0,1fr) rather than a fixed minimum: on a 420px-tall landscape
     phone a floor of 66px per key overflowed the well and forced it to
     scroll. Four rows sharing whatever height exists always fits. */
  .keypad, .contact-slot { grid-auto-rows: minmax(0, 1fr); padding: 8px; gap: 6px; }
  .hero .tube-face { padding-block: 16px; }
  .tube-title { min-height: 1.1em; }
}

/* Hi-dpi: tighten the scanline pitch so it does not read as stripes. */
@media (min-resolution: 2dppx) {
  .tube-glass::after {
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.3) 0 1px, transparent 1px 2px),
      repeating-linear-gradient(90deg, rgba(255,60,20,.04) 0 1px, rgba(70,255,120,.02) 1px 2px, rgba(40,90,255,.04) 2px 3px);
  }
}

/* Coarse pointers get no parallax and larger hit targets. */
@media (hover: none) {
  .key:hover, .chan:hover, .commit:hover, .btn-back:hover { transform: none; }
  .commit:hover::after { animation: none; }
  .chan { padding-block: 14px; }
}

/* ═══ REDUCED MOTION ════════════════════════════════════════════════
   Every ambient loop, parallax spring, decode scramble and tube
   strike is suppressed. State still changes — it just arrives
   instead of animating. ═══════════════════════════════════════════ */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
  .tube-sweep { display: none; }
  .caret::after { animation: none; opacity: 1; }
  .console { transform: none !important; }
  .chassis::before { background: linear-gradient(158deg, rgba(255,255,255,.28), transparent 60%); }
  .spec { opacity: 1; }
  .commit::after { display: none; }
}

/* Forced colours: drop the fiction, keep the structure legible. */
@media (forced-colors: active) {
  .tube-glass, .tube-sweep, .chassis::before, .chassis::after, .screw { display: none; }
  .key, .chan, .commit, .btn-back { border: 1px solid CanvasText; }
  .chan[aria-current="true"] { outline: 2px solid Highlight; }
}

/* ═══ DECODE ════════════════════════════════════════════════════════
   The headline resolves character by character. Every glyph keeps its
   cell for the whole animation, so the line never re-wraps mid-decode
   — which is why this uses spans instead of rewriting textContent. */
.tube-title span { color: var(--p-mid); opacity: .34; }
.tube-title span.scan {
  color: #fff; opacity: 1;
  text-shadow: 0 0 6px var(--p), 0 0 16px rgba(255,140,20,.7);
}
.tube-title span.done { color: var(--p-hot); opacity: 1; }

/* Body copy is revealed, not scrambled — scrambled prose is just noise
   to read through, and it delays comprehension for no gain. */
.tube-body.fresh { animation: revealBody 420ms var(--ease-out) both; }
@keyframes revealBody {
  from { opacity: 0; transform: translateY(6px); filter: blur(4px); }
  to   { opacity: 1; transform: none; filter: blur(0); }
}

/* Key lamps latch on hover and on keyboard focus alike. */
.key:hover .lamp, .key:focus-visible .lamp,
.btn-contact:hover .lamp, .btn-contact:focus-visible .lamp {
  background: var(--c);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.7),
    0 0 0 1px rgba(0,0,0,.15),
    0 0 8px 1px var(--c),
    0 0 18px 3px color-mix(in srgb, var(--c) 45%, transparent);
}
.tube-specs[hidden] { display: none; }
</style>
</head>
<body>

<div class="stage">
<div class="console" id="console">
<div class="chassis" id="chassis" data-boot>

  <div class="sheen" id="sheen" aria-hidden="true"></div>
  <i class="screw"></i><i class="screw"></i><i class="screw"></i><i class="screw"></i>

  <!-- ═══ BROW RAIL ═══════════════════════════════════════════════ -->

   One flat record per LEAF service — folders are paths, not results.
   Built once from CFG, so adding a service to the catalogue puts it in
   the finder with no second edit. Each record keeps the coordinates

const INDEX = [];
/* Wrapped in a function because the haystack below is built out of the
   catalogue's own words. Change the language of the catalogue and a
   one-shot index is still quietly matching the old one. */
function buildIndex() {
INDEX.length = 0;
CFG.banks.forEach((bank, b) => {
  bank.items.forEach((it, i) => {
    const push = (item, g, idx, group, sec) => INDEX.push({
      b, g, i: idx, item, bank, group, sec,
      /* Lowercased once here rather than per keystroke per record. */
      name: item.name.toLowerCase(),
      /* Description text is included so symptoms find services —
         "blue screen", "puffy battery", "dead zones" are how people
         actually describe the problem they have. It scores lowest, so
         a name match still wins. `alt` carries the shorthand nobody
         writes out: ps5, wifi, seo. */
      hay: [item.name, item.alt || '', item.note, item.desc, item.ref,
            bank.name, group ? group.name : '', sec || '',
            ...(item.specs || [])].join(' \u0001 ').toLowerCase()
    });
    if (it.group) {
      /* `sec` is declared once per family and runs until the next one,
         so it has to be carried forward — otherwise only the Wii knows
         it is a Nintendo and the other three come back unlabelled. */
      let sec = null;
      it.items.forEach((sub, si) => { if (sub.sec) sec = sub.sec; push(sub, i, si, it, sec); });
    } else push(it, null, i, null, it.sec || null);
  });
});
}
buildIndex();

const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();

/* Every term must appear somewhere in the record, and the score is the
   best place each one landed. A name match beats a spec match, so
   "vita" surfaces the Vita before the three services that merely
   mention memory cards. */
function search(q) {
  const terms = norm(q).split(' ').filter(Boolean);
  if (!terms.length) return [];
  const hits = [];
  for (const r of INDEX) {
    let score = 0, ok = true;
    for (const t of terms) {
      const n = r.name.indexOf(t);
      let s = 0;
      if (n === 0) s = 100;
      else if (n > 0) s = r.name[n - 1] === ' ' ? 78 : 52;
      else if (r.hay.includes(t)) s = 18;
      else { ok = false; break; }
      score += s;
    }
    if (!ok) continue;
    /* Shorter names are the more exact answer to the same query. */
    hits.push({ r, score: score - r.name.length * 0.12 });
  }
  hits.sort((a, x) => x.score - a.score);
  return hits.slice(0, 30).map(h => h.r);
}

/* ═══ STAGE (phone only) ════════════════════════════════════════════
   The phone shows the channel list and the readout one at a time; the
   desktop shows both side by side and must never see this attribute.
   Every write goes through here, and leaving phone width clears it, so
   a rotate or a resize cannot strand the wide layout in a stage. */
let BACK_HOME = $('#back-label').textContent.trim();

/* The phone has one screen per category now, so the stage attribute
   only survives for the desktop code paths that still read it. */
function setStage(st) {
  D.cat.removeAttribute('data-stage');
  syncBack();
}
/* Back leaves a folder first, then the bank. Two levels, matching the
   two levels the content actually has. */
function syncBack() {
  D.backLabel.textContent = (phone() && S.group != null)
    ? (bankAt()?.name || BACK_HOME) : BACK_HOME;
}
MQ_PHONE.addEventListener('change', () => {
  D.cat.removeAttribute('data-stage');
  syncBack();
  if (phone()) requestAnimationFrame(() => centreCard(false));
});

/* ── Current list + item ─────────────────────────────────────────── */
const bankAt   = () => CFG.banks[S.bank] || null;
/* A group row is a folder, not a service. Counting rows would report
   Video Games as 5 when it holds 21 — so count leaves. */
const leafCount = list => list.reduce((n, x) => n + (x.group ? leafCount(x.items) : 1), 0);
const services = b => leafCount(b.items);
const listNow  = () => {
  const b = bankAt(); if (!b) return [];
  return S.group == null ? b.items : (b.items[S.group]?.items || []);
};
const itemNow  = () => listNow()[S.item] || null;

/* ═══ TICKER ════════════════════════════════════════════════════════
   One rAF loop drives the parallax spring and every text decode, and
   it parks itself the moment there is no work left. ═══════════════ */

let raf = 0;
const wake = () => { if (!raf) raf = requestAnimationFrame(tick); };

function tick(t) {
  raf = 0;
  let live = false;
  if (para)         { stepParallax(); live = true; }
  if (decodes.size) { stepDecodes(t); live = true; }
  if (live) wake();
}

/* ── Parallax: a critically-damped spring, not 1:1 mouse tracking.
      Reads only clientX/innerWidth, so it never touches layout. ──── */
let tX = 0, tY = 0, cX = 0, cY = 0, vX = 0, vY = 0, para = false;
const SPRING = 0.075, DAMP = 0.78, TILT = 3.4, SHEEN = 26;

function stepParallax() {
  vX = (vX + (tX - cX) * SPRING) * DAMP; cX += vX;
  vY = (vY + (tY - cY) * SPRING) * DAMP; cY += vY;
  D.console.style.setProperty('--ry', (cX * TILT).toFixed(3) + 'deg');
  D.console.style.setProperty('--rx', (-cY * TILT).toFixed(3) + 'deg');
  D.sheen.style.transform =
    `translate3d(${(-50 + cX * SHEEN).toFixed(2)}%, ${(-50 + cY * SHEEN).toFixed(2)}%, 0)`;
  if (Math.abs(vX) < 2e-4 && Math.abs(vY) < 2e-4 &&
      Math.abs(tX - cX) < 1e-3 && Math.abs(tY - cY) < 1e-3) para = false;
}

addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || calm() || !MQ_WIDE.matches) return;
  tX = clamp(e.clientX / innerWidth  - .5, -.5, .5);
  tY = clamp(e.clientY / innerHeight - .5, -.5, .5);
  para = true; wake();
}, { passive: true });

const restTilt = () => { tX = 0; tY = 0; para = true; wake(); };
document.documentElement.addEventListener('pointerleave', restTilt);
addEventListener('blur', restTilt);
MQ_WIDE.addEventListener('change', restTilt);

/* ── Decode: per-character spans so the scan head can glow and the
      line's wrap points never shift mid-animation. ──────────────── */
const GLYPHS = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&*+=<>/\\';
const glyph = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];
const decodes = new Set();

function decode(node, text) {
  for (const d of decodes) if (d.node === node) decodes.delete(d);
  node.textContent = '';
  if (!text) return;
  if (calm()) { node.textContent = text; return; }

  const chars = [...text], spans = [], frag = document.createDocumentFragment();
  for (const ch of chars) {
    const s = mk('span', ch.trim() ? 'g' : null, ch.trim() ? glyph() : ch);
    if (!ch.trim()) s.dataset.gap = '1';
    frag.appendChild(s); spans.push(s);
  }
  node.appendChild(frag);
  decodes.add({ node, chars, spans, t0: null, at: -1,
                dur: clamp(220 + chars.length * 20, 260, 760) });
  wake();
}

function stepDecodes(t) {
  for (const d of [...decodes]) {
    if (d.t0 === null) d.t0 = t;
    const p = clamp((t - d.t0) / d.dur, 0, 1);
    const upto = Math.floor(d.chars.length * (1 - Math.pow(1 - p, 3)));

    for (let i = d.at + 1; i < upto; i++) lock(d, i);
    d.at = Math.max(d.at, upto - 1);

    for (let i = upto; i < Math.min(upto + 7, d.chars.length); i++) {
      const s = d.spans[i]; if (s.dataset.gap) continue;
      s.textContent = glyph();
      s.className = i < upto + 3 ? 'g scan' : 'g';
    }
    if (p >= 1) {
      for (let i = 0; i < d.spans.length; i++) lock(d, i);
      decodes.delete(d);
    }
  }
}
function lock(d, i) {
  const s = d.spans[i]; if (!s || s.dataset.gap) return;
  s.textContent = d.chars[i]; s.className = 'g done';
}

/* ═══ AUDIO ═════════════════════════════════════════════════════════
   Synthesised on the fly — no files, no requests. Off until asked;
   the AudioContext is not even constructed before then. ══════════ */

let AC = null, master = null, humNodes = null, noise = null;

function ensureAudio() {
  if (AC) return AC;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  AC = new Ctx();
  master = AC.createGain();
  master.gain.value = 0;
  master.connect(AC.destination);
  return AC;
}
function noiseBuffer(c) {
  if (noise) return noise;
  noise = c.createBuffer(1, c.sampleRate * 0.25, c.sampleRate);
  const ch = noise.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  return noise;
}
function clack(level = 0.5, hz = 2300, len = 0.05) {
  if (!S.audio || !AC) return;
  const n = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuffer(AC);
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = hz; bp.Q.value = 1.1;
  const g = AC.createGain();
  g.gain.setValueAtTime(level * 0.16, n);
  g.gain.exponentialRampToValueAtTime(0.0001, n + len);
  src.connect(bp).connect(g).connect(master);
  src.start(n); src.stop(n + len + 0.02);
}
function thunk() {
  if (!S.audio || !AC) return;
  const n = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(160, n);
  o.frequency.exponentialRampToValueAtTime(40, n + 0.24);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.14, n);
  g.gain.exponentialRampToValueAtTime(0.0001, n + 0.34);
  o.connect(g).connect(master); o.start(n); o.stop(n + 0.36);
  clack(0.3, 900, 0.08);
}
function startHum() {
  if (humNodes || !AC) return;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
  const g = AC.createGain(); g.gain.value = 0.05;
  const a = AC.createOscillator(); a.type = 'sine'; a.frequency.value = 60;
  const b = AC.createOscillator(); b.type = 'sine'; b.frequency.value = 120.4;
  a.connect(lp); b.connect(lp); lp.connect(g).connect(master);
  a.start(); b.start();
  humNodes = [a, b];
}
function setAudio(on) {
  S.audio = on;
  D.pwr.setAttribute('aria-pressed', String(on));
  const c = on ? ensureAudio() : AC;
  if (!c) { S.audio = false; D.pwr.setAttribute('aria-pressed', 'false'); return; }
  if (c.state === 'suspended') c.resume();
  if (on) startHum();
  master.gain.cancelScheduledValues(c.currentTime);
  master.gain.setTargetAtTime(on ? 1 : 0, c.currentTime, 0.07);
  say(on ? 'Audio on' : 'Audio off');
}

/* ═══ TUBE EFFECTS ══════════════════════════════════════════════════ */

function replay(node, cls) {
  if (!node) return;
  node.classList.remove(cls);
  void node.offsetWidth;          // force the animation to restart
  node.classList.add(cls);
}
function strike(raster, flashEl) {
  if (calm()) return;
  replay(raster, 'striking');
  replay(flashEl, 'firing');
  thunk();
}
function bloom(face) {
  if (calm()) return;
  face.style.setProperty('--bloom', '1');
  requestAnimationFrame(() => requestAnimationFrame(() => face.style.setProperty('--bloom', '0')));
}
/* Horizontal-hold slip: rare and brief. A constant wobble reads as
   broken hardware; an occasional one reads as old hardware. */
function scheduleSlip() {
  if (calm()) return;
  setTimeout(() => {
    if (!document.hidden && S.booted && Math.random() < 0.4) {
      const r = D.cat.hasAttribute('data-active') ? D.raster : D.heroRaster;
      if (!r.classList.contains('striking')) replay(r, 'slipping');
    }
    scheduleSlip();
  }, 9000 + Math.random() * 17000);
}

const say = msg => { D.say.textContent = ''; D.say.textContent = msg; };

/* ═══ RENDER ════════════════════════════════════════════════════════ */

function svgIcon(paths, cls) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');

  s.setAttribute('aria-hidden', 'true');

  return s;
}

function buildLamps() {

function lampSet(only) {

/* Hovering or focusing a key retargets the hero readout — the hero is
   an instrument display, not a banner, so it reports what you point at. */
let heroAt;
/* BANK 02 · 21 SERVICES — assembled in two places, so it lives in one. */
const bankKicker = (i, b) =>
  `${CFG.ui.words.bankUp} ${pad2(i + 1)} · ${services(b)} ${CFG.ui.words.servicesUp}`;

/* The lowest real figure in a bank, or across the whole catalogue.
   Read off the prices themselves so the readout cannot quote a number
   the list no longer contains; rates with no figure in them — Quoted,
   Varies, Cash offer — simply do not vote. Memoised because this runs
   on every pointer crossing. */
const RATE_FIG = r => {
  const m = String(r || '').match(/\$\s*([\d,]+)/);
  return m ? +m[1].replace(/,/g, '') : null;
};
const leafItems = b => b.items.flatMap(x => x.group ? x.items : [x]);
const entryCache = new Map();
function entryFrom(b) {
  const key = b ? b.id : '*';
  if (entryCache.has(key)) return entryCache.get(key);
  const figs = (b ? [b] : CFG.banks).flatMap(leafItems).map(x => RATE_FIG(x.rate)).filter(n => n != null);
  const out = figs.length ? '$' + Math.min(...figs).toLocaleString() : '—';
  entryCache.set(key, out);
  return out;
}
const SVC_TOTAL = CFG.banks.reduce((n, b) => n + services(b), 0);

function setHero(i, force) {

  heroAt = i;
