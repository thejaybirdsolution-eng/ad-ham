/* Hovering or focusing a key retargets the hero readout — the hero is
   an instrument display, not a banner, so it reports what you point at. */
let heroAt, heroWasTouch;
function setHero(i, force) {
  /* Crossing the phone breakpoint has to be able to re-run the resting
     state even when the target has not changed, or a rotate leaves the
     desktop question on a touch layout. */
  const touch = phone();
  if (i === heroAt && touch === heroWasTouch && !force) return;
  heroAt = i; heroWasTouch = touch;

  const H = CFG.home;
  const b = i == null ? null : CFG.banks[i];
  D.heroKicker.textContent = b ? `BANK ${pad2(i + 1)} · ${services(b)} SERVICES`
                               : ((touch && H.kickerTouch) || H.kicker);
  D.heroLine.textContent   = b ? b.name : ((touch && H.lineTouch) || H.line);
  D.heroNote.textContent   = b ? b.blurb : ((touch && H.noteTouch) || H.note);
  lampSet(b ? i : null);
  bloom($('.tube-face', D.heroRaster));
}
MQ_PHONE.addEventListener('change', () => { if (S.booted && S.bank < 0) setHero(null, true); });

/* Every paged well is a function of the viewport, so a rotate, a
   split-screen resize or a soft keyboard has to re-measure. Debounced,
   because iOS fires resize continuously through the rotation. */
let repageT;
function repageAll() {
  clearTimeout(repageT);
  repageT = setTimeout(() => {
    if (!S.booted) return;
    if (D.results && !D.results.hidden) pageFind();
    if (D.bank.children.length) pageToItem();
    fitFace();
  }, 120);
}
addEventListener('resize', repageAll);
addEventListener('orientationchange', repageAll);

/* ═══ FINDER ════════════════════════════════════════════════════════
   The keypad and the results share one slot: typing swaps the four
   bank keys for matches, clearing swaps them back. Nothing overlays
   anything, so there is never a moment where both are on screen and
   the visitor has to work out which one is live. ══════════════════ */

/* ═══ PAGE ENGINE ═══════════════════════════════════════════════════
   The phone shell does not scroll, so any list longer than its well is
   cut into pages that DO fit. The cut is made by measurement, not by a
   row count: children are walked in order and a page closes the moment
   the next child would cross the bottom edge.

   Measuring rather than assuming is what makes this survive contact
   with real hardware. Rows are not a uniform height — a channel with a
   two-line name is taller than one with a short name, and a family
   divider is shorter than either — so any fixed rows-per-page would be
   wrong on most pages of most banks on most phones. Walking the real
   boxes is right on all of them, including phones that did not exist
   when this was written.
   ══════════════════════════════════════════════════════════════════ */

function makeDeck(el, onGo) {
  const dots = $('.deck-dots', el), at = $('.deck-at', el);
  const prev = $('.pg[data-dir="-1"]', el), next = $('.pg[data-dir="1"]', el);
  let pages = 1, page = 0;
  prev.addEventListener('click', () => { clack(0.6, 1900, 0.05); onGo(page - 1); });
  next.addEventListener('click', () => { clack(0.6, 1900, 0.05); onGo(page + 1); });
  return {
    set(total, current, lamp) {
      pages = Math.max(1, total); page = current;
      el.style.setProperty('--c', lamp || 'var(--anod)');
      /* Pips and a counter say the same thing. Show the pips when they
         fit and let them carry it; fall back to the number when the
         page count is past counting at a glance. */
      at.textContent = (pages > 9) ? `${page + 1}/${pages}` : '';
      prev.disabled = page <= 0;
      next.disabled = page >= pages - 1;
      /* Pips only earn their space when there is more than one page,
         and past about nine they stop being countable — the numeric
         readout beside them carries it from there. */
      const show = (pages > 1 && pages <= 9) ? pages : 0;
      if (dots.childElementCount !== show) {
        dots.textContent = '';
        for (let i = 0; i < show; i++) dots.appendChild(mk('span', 'deck-dot'));
      }
      [...dots.children].forEach((dot, i) => { dot.dataset.on = i === page ? '1' : '0'; });
    },
    get page() { return page; },
    get pages() { return pages; }
  };
}

/* Returns the index each page starts at. A child taller than the well
   still gets its own page rather than being dropped. */
function pageBreaks(kids, availH, gap) {
  const breaks = [0];
  let used = 0;
  kids.forEach((el, i) => {
    const h = el.offsetHeight;
    const add = used ? h + gap : h;
    if (used && used + add > availH) { breaks.push(i); used = h; }
    else used += add;
  });
  return breaks;
}

/* Lays every child out, measures the well, then hides everything off
   the current page. Children must be visible to be measured, which is
   why the reset comes first. Desktop keeps every row on screen. */
function repage(host, deck, page, lamp) {
  const kids = [...host.children];
  kids.forEach(k => k.classList.remove('is-off'));
  if (!kids.length || !phone()) { deck.set(1, 0, lamp); return 0; }

  const cs = getComputedStyle(host);
  const gap = parseFloat(cs.rowGap) || 0;
  const availH = host.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (availH <= 0) { deck.set(1, 0, lamp); return 0; }

  const breaks = pageBreaks(kids, availH, gap);
  const p = Math.max(0, Math.min(page, breaks.length - 1));
  const from = breaks[p], to = (p + 1 < breaks.length) ? breaks[p + 1] : kids.length;
  kids.forEach((k, i) => k.classList.toggle('is-off', i < from || i >= to));
  deck.set(breaks.length, p, lamp);
  return p;
}

/* Which page is a given child on. Used when selection moves by
   keyboard, deep link or search rather than by the page keys. */
function pageOf(host, idx) {
  const kids = [...host.children];
  kids.forEach(k => k.classList.remove('is-off'));
  const cs = getComputedStyle(host);
  const gap = parseFloat(cs.rowGap) || 0;
  const availH = host.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const breaks = pageBreaks(kids, availH, gap);
  let p = 0;
  breaks.forEach((b, i) => { if (idx >= b) p = i; });
  return p;
}

/* Matched runs are wrapped in <mark> by walking the string and building
   text nodes — the query is user input and never becomes markup. */
function markName(host, name, terms) {
  const lower = name.toLowerCase();
  const spans = [];
  for (const t of terms) {
    let from = 0, at;
    while ((at = lower.indexOf(t, from)) !== -1) { spans.push([at, at + t.length]); from = at + t.length; }
  }
  if (!spans.length) { host.textContent = name; return; }
  spans.sort((a, b) => a[0] - b[0]);
  const merged = [spans[0]];
  for (const s of spans.slice(1)) {
    const last = merged[merged.length - 1];
    if (s[0] <= last[1]) last[1] = Math.max(last[1], s[1]);
    else merged.push(s);
  }
  let cursor = 0;
  for (const [a, b] of merged) {
    if (a > cursor) host.appendChild(document.createTextNode(name.slice(cursor, a)));
    host.appendChild(mk('mark', null, name.slice(a, b)));
    cursor = b;
  }
  if (cursor < name.length) host.appendChild(document.createTextNode(name.slice(cursor)));
}

let findHits = [];

function renderResults(q) {
  const F = CFG.ui.find;
  const on = q.trim().length > 0;

  D.findX.hidden = !on;
  D.keypad.hidden = on;
  D.results.hidden = !on;
  D.banksLegend.textContent = on ? F.legend : F.banks;

  if (!on) {
    findHits = []; D.findHits.textContent = ''; D.results.textContent = '';
    S.findPage = 0; deckHome.set(1, 0); return;
  }

  findHits = search(q);
  D.results.textContent = '';
  D.results.scrollTop = 0;
  D.findHits.textContent = findHits.length ? F.hits(findHits.length) : F.noneHead;

  if (!findHits.length) {
    const none = mk('div', 'res-none');
    none.appendChild(mk('b', null, F.noneHead));
    none.appendChild(document.createTextNode(F.noneBody));
    D.results.appendChild(none);
    S.findPage = 0; requestAnimationFrame(pageFind);
    return;
  }

  const terms = norm(q).split(' ').filter(Boolean);
  findHits.forEach((r, n) => {
    const el = mk('button', 'res');
    el.type = 'button';
    el.dataset.n = String(n);
    el.style.setProperty('--c', r.bank.lamp);
    el.style.setProperty('--d', Math.min(n * 22, 260) + 'ms');

    const name = mk('span', 'res-name');
    markName(name, r.item.name, terms);
    el.appendChild(name);

    /* The path answers "where was this hiding" — it teaches the tree
       while bypassing it. Bank plus family, because that is the pair
       that identifies the place; adding the folder name on top made
       "Video Games › Game Console Modifications › PlayStation" and
       ellipsised on every phone that matters. */
    const path = [r.bank.name, r.sec || (r.group && r.group.name)].filter(Boolean).join('  ›  ');
    el.appendChild(mk('span', 'res-path', path));
    el.appendChild(mk('span', 'res-price', r.item.rate || ''));

    el.setAttribute('aria-label',
      `${r.item.name}. ${r.item.rate ? r.item.rate + '. ' : ''}In ${path}.`);
    D.results.appendChild(el);
  });

  /* Measure after the browser has laid the rows out, not before. */
  S.findPage = 0;
  requestAnimationFrame(pageFind);
}

/* One deck per paged well. Both call back into the same repage(). */
const deckHome = makeDeck(D.deckHome, p => { S.findPage = p; pageFind(); });
const deckBank = makeDeck(D.deckBank, p => { S.listPage = p; pageList(); });

function pageFind() { S.findPage = repage(D.results, deckHome, S.findPage); }
function pageList() {
  const lamp = CFG.banks[S.bank] ? CFG.banks[S.bank].lamp : null;
  S.listPage = repage(D.bank, deckBank, S.listPage, lamp);
}
/* Keeps the current channel on screen when selection moves by keyboard,
   deep link or search instead of by the page keys. */
function pageToItem() {
  if (phone() && D.bank.children.length) {
    const el = D.bank.querySelector('.chan[aria-current="true"]');
    if (el) {
      const idx = [...D.bank.children].indexOf(el);
      if (idx >= 0) S.listPage = pageOf(D.bank, idx);
    }
  }
  /* Always hand off to pageList: on desktop that is what unhides every
     row and collapses the deck after a resize back up from phone. */
  pageList();
}

function clearFind({ focus = false } = {}) {
  D.find.value = '';
  renderResults('');
  if (focus) D.find.focus();
}

/* A result carries its own coordinates, so opening one is a direct
   seek: set the bank, drop into the folder if it has one, land on the
   item. No walking, and no intermediate screens flashing past. */
function openResult(r) {
  openBank(r.b, { focus: false });
  S.group = r.g;
  S.item  = r.i;
  buildBank(); paint();
  strike(D.raster, D.flash);
  setHash(CFG.banks[r.b].id, r.item.ref);
  clearFind();
  if (phone()) { openDetail(); return; }
  requestAnimationFrame(() =>
    D.bank.querySelector('.chan[aria-current="true"]')
      ?.scrollIntoView({ block: 'center', behavior: calm() ? 'auto' : 'smooth' }));
}

D.find.addEventListener('input', () => renderResults(D.find.value));
D.findX.addEventListener('click', () => { clack(0.5, 2200, 0.03); clearFind({ focus: true }); });

D.results.addEventListener('click', e => {
  const el = e.target.closest('.res'); if (!el) return;
  const r = findHits[+el.dataset.n]; if (!r) return;
  clack(0.9, 1700, 0.07);
  replay(D.console, 'knock');
  openResult(r);
});

/* Enter opens the top match; Down walks into the list. Both let a
   keyboard finish the job without leaving the field. */
D.find.addEventListener('keydown', e => {
  if (e.key === 'Enter' && findHits[0]) { e.preventDefault(); openResult(findHits[0]); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); $('.res', D.results)?.focus(); }
  else if (e.key === 'Escape' && D.find.value) { e.preventDefault(); clearFind({ focus: true }); }
});
D.results.addEventListener('keydown', e => {
  const el = e.target.closest('.res'); if (!el) return;
  const n = +el.dataset.n;
  if (e.key === 'ArrowDown') { e.preventDefault(); (D.results.children[n + 1] || D.find).focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); (n ? D.results.children[n - 1] : D.find).focus(); }
});

function buildBank() {
  D.bank.textContent = '';
  D.track.textContent = '';
  const b = bankAt(); if (!b) return;
  const inGroup = S.group != null;
  const items = listNow();
  let offset = 0;

  D.bankLabel.textContent = inGroup ? b.items[S.group].name : CFG.ui.bankLabel;
  D.bankCount.textContent = pad2(items.length);

  if (inGroup) {
    const up = mk('button', 'chan is-up');
    up.type = 'button';
    up.style.setProperty('--d', '0ms');
    up.appendChild(mk('span', 'chan-name', `${CFG.ui.up} ${b.name}`));
    up.addEventListener('click', () => exitGroup());
    D.bank.appendChild(up);
    offset = 34;
  }

  if (!items.length) {
    const e = mk('div', 'bank-empty', CFG.ui.empty.bank);
    D.bank.appendChild(e);
    return;
  }

  let sec = null;
  items.forEach((it, i) => {
    /* A divider is emitted only where the content changes family, so a
       flat list stays flat and the seventeen-console list gets five
       headings without either case needing its own code path. */
    if (it.sec && it.sec !== sec) {
      sec = it.sec;
      const h = mk('p', 'bank-sec', it.sec);
      h.setAttribute('role', 'presentation');
      D.bank.appendChild(h);
    }
    const c = mk('button', 'chan' + (it.group ? ' is-group' : ''));
    c.type = 'button';
    c.dataset.i = String(i);
    c.setAttribute('aria-current', String(i === S.item));
    c.tabIndex = i === S.item ? 0 : -1;
    c.style.setProperty('--d', (offset + i * 28) + 'ms');
    c.appendChild(mk('span', 'chan-name', it.name));
    if (it.note) c.appendChild(mk('span', 'chan-note', it.note));
    c.appendChild(mk('span', 'chan-price',
      it.rate || (it.group ? `${it.items.length} ${it.countLabel || 'options'}` : '')));
    D.bank.appendChild(c);

    /* The phone's copy of the same row. Built from the same item in
       the same pass so the two can never disagree about what is in
       the bank or what order it is in. */
    const card = mk('button', 'tcard' + (it.group ? ' is-group' : ''));
    card.type = 'button';
    card.dataset.i = String(i);
    card.setAttribute('aria-current', String(i === S.item));
    card.style.setProperty('--c', bank.lamp);
    card.appendChild(mk('span', 'tcard-sec', it.sec || (it.group ? 'Folder' : '')));
    card.appendChild(mk('span', 'tcard-name', it.name));
    card.appendChild(mk('span', 'tcard-price',
      it.rate || (it.group ? String(it.items.length) : '')));
    if (it.note) card.appendChild(mk('span', 'tcard-note', it.note));
    D.track.appendChild(card);
  });
  requestAnimationFrame(() => { pageToItem(); centreCard(false); });
}

/* ═══ TUNER ═════════════════════════════════════════════════════════
   Two directions of sync, and the only hard part is stopping them
   chasing each other: a swipe moves the selection, and a selection
   moves the swipe. `tunerLock` marks scrolls this code caused so the
   scroll handler ignores its own work. ═════════════════════════════ */

let tunerLock = 0, tunerIdle;

function centreCard(smooth = true) {
  if (!phone()) return;
  const card = D.track.children[S.item];
  if (!card) return;
  const to = card.offsetLeft - (D.track.clientWidth - card.offsetWidth) / 2;
  if (Math.abs(D.track.scrollLeft - to) < 2) return;
  tunerLock = Date.now();
  D.track.scrollTo({ left: to, behavior: (smooth && !calm()) ? 'smooth' : 'auto' });
}

function markCards() {
  [...D.track.children].forEach((c, i) =>
    c.setAttribute('aria-current', String(i === S.item)));
}

/* Whichever card is nearest the centre of the track is the live one. */
function cardAtCentre() {
  const mid = D.track.scrollLeft + D.track.clientWidth / 2;
  let best = 0, dist = Infinity;
  [...D.track.children].forEach((c, i) => {
    const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid);
    if (d < dist) { dist = d; best = i; }
  });
  return best;
}

D.track.addEventListener('scroll', () => {
  if (!phone()) return;
  /* Smooth scrolls we started keep firing events for a few hundred ms;
     acting on those would fight the animation we just asked for. */
  if (Date.now() - tunerLock < 420) return;
  clearTimeout(tunerIdle);
  tunerIdle = setTimeout(() => {
    const i = cardAtCentre();
    if (i === S.item) return;
    S.item = i;
    markCards();
    paint();
    strike(D.raster, D.flash);
    clack(0.4, 2600, 0.04);
    setHash(bankAt()?.id, itemNow()?.ref);
  }, 90);
});

/* Tapping a card that is already centred is the same as pressing the
   request key — the card under your thumb should do the obvious thing. */
D.track.addEventListener('click', e => {
  const card = e.target.closest('.tcard'); if (!card) return;
  const i = +card.dataset.i;
  if (i !== S.item) { selectItem(i); return; }
  D.commit.click();
});

$$('.tuner-arrow', D.tuner).forEach(b =>
  b.addEventListener('click', () => { clack(0.6, 1900, 0.05); step(+b.dataset.dir); }));

function syncTunerArrows() {
  const last = listNow().length - 1;
  $$('.tuner-arrow', D.tuner).forEach(b => {
    b.disabled = +b.dataset.dir < 0 ? S.item <= 0 : S.item >= last;
  });
}

function setBody(text) {
  D.tBody.textContent = text || '';
  if (!calm() && text) replay(D.tBody, 'fresh');
}
function setSpecs(rows) {
  D.tSpecs.textContent = '';
  D.tSpecs.hidden = !rows.length;
  rows.forEach((r, i) => {
    const s = mk('div', 'spec');
    s.appendChild(mk('span', null, r));
    s.style.setProperty('--d', (calm() ? 0 : 260 + i * 70) + 'ms');
    D.tSpecs.appendChild(s);
  });
}
function setState(kind, label) {
  D.tState.dataset.state = kind;
  D.tState.textContent = label;
}

/* The pager is the visible half of the swipe. It also reports list
   length, which is the one number the phone layout otherwise hides —
   on a desktop the whole rail is on screen and you can just see it. */
function setPager() {
  const items = listNow(), n = items.length;
  const has = n > 1;
  D.pgAt.textContent = has ? `${pad2(S.item + 1)} / ${pad2(n)}` : '—';
  D.pgPrev.disabled = !has || S.item <= 0;
  D.pgNext.disabled = !has || S.item >= n - 1;
}

/* Steps the readout down a notch at a time until it fits its tube.
   Three notches, then the status line goes; past that the copy is
   longer than any phone can hold, which is a content problem rather
   than a layout one. */
function fitFace() {
  if (!phone()) return;
  const face = $('.tube-face', D.raster);
  if (!face) return;
  face.classList.remove('fit-1', 'fit-2', 'fit-3');
  for (const step of ['fit-1', 'fit-2', 'fit-3']) {
    if (face.scrollHeight <= face.clientHeight + 1) return;
    face.classList.add(step);
  }
}

function paint() {
  const items = listNow(), it = itemNow();
  setPager();
  syncTunerArrows();
  if (!it) {
    D.tRef.textContent = '—'; D.tRate.textContent = '—';
    decode(D.tTitle, CFG.ui.empty.title);
    setBody(CFG.ui.empty.body);
    setSpecs([]);
    D.tSeq.textContent = `${CFG.ui.seq} —`;
    setState('idle', CFG.ui.state.idle);
    return;
  }
  D.tSeq.textContent = `${CFG.ui.seq} ${pad2(S.item + 1)}/${pad2(items.length)}`;
  D.tRef.textContent = it.ref || '—';
  setState('idle', CFG.ui.state.idle);
  decode(D.tTitle, it.name.toUpperCase());

  if (it.group) {
    D.tRate.textContent = `${it.items.length} ${it.countLabel || 'options'}`;
    setBody(it.desc || '');
    setSpecs(it.items.map(x => x.rate ? `${x.name} — ${x.rate}` : x.name));
    D.commitLabel.textContent = CFG.ui.openGroup;
  } else {
    D.tRate.textContent = it.rate || '—';
    setBody(it.desc || '');
    setSpecs(it.specs || []);
    D.commitLabel.textContent = CFG.commit;
  }
  bloom($('.tube-face', D.raster));
  requestAnimationFrame(fitFace);
  say(`${it.name}. ${it.rate ? it.rate + '. ' : ''}${it.group ? it.items.length + ' options inside.' : (it.desc || '')}`);
}

/* ═══ NAVIGATION ════════════════════════════════════════════════════ */

function showView(v) {
  [D.home, D.cat].forEach(x => x.toggleAttribute('data-active', x === v));
}

function openBank(i, { focus = true } = {}) {
  S.listPage = 0;
  const b = CFG.banks[i]; if (!b) return;
  S.bank = i; S.group = null; S.item = 0;

  D.cat.style.setProperty('--c', b.lamp);
  D.catLamp.style.setProperty('--c', b.lamp);
  D.catName.textContent = b.name;
  D.catKicker.textContent = `BANK ${pad2(i + 1)} · ${services(b)} SERVICES`;

  buildBank(); paint();
  showView(D.cat);
  setStage('list');
  strike(D.raster, D.flash);
  lampSet(i);
  setHash(b.id, itemNow()?.ref);
  if (focus && !phone()) requestAnimationFrame(() => $('.chan[data-i]', D.bank)?.focus({ preventScroll: true }));
}

function goHome({ focus = true } = {}) {
  const prev = S.bank;
  S.bank = -1; S.group = null; S.item = 0;
  showView(D.home);
  setHero(null);
  strike(D.heroRaster, D.heroFlash);
  setHash(null);
  if (focus) requestAnimationFrame(() =>
    (D.keypad.children[clamp(prev, 0, D.keypad.children.length - 1)] || D.keypad.firstElementChild)
      ?.focus({ preventScroll: true }));
}

function selectItem(i, { focus = false, scroll = true } = {}) {
  const items = listNow();
  if (!items.length) return;
  S.item = clamp(i, 0, items.length - 1);
  [...D.bank.querySelectorAll('.chan[data-i]')].forEach(c => {
    const on = +c.dataset.i === S.item;
    c.setAttribute('aria-current', String(on));
    c.tabIndex = on ? 0 : -1;
    if (on) {
      /* Nothing scrolls on a phone, so bring the PAGE to the selection
         instead of bringing the selection into view. */
      if (scroll && !phone()) c.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: calm() ? 'auto' : 'smooth' });
      if (focus) c.focus({ preventScroll: true });
    }
  });
  if (phone()) { pageToItem(); markCards(); centreCard(); }
  paint();
  clack(0.35, 3200, 0.035);
  setHash(bankAt()?.id, itemNow()?.ref);
}

function enterGroup(i) {
  const g = listNow()[i];
  if (!g || !g.group) return;
  S.group = i; S.item = 0;
  buildBank(); paint();
  strike(D.raster, D.flash);
  syncBack();
  setHash(bankAt()?.id, itemNow()?.ref);
  if (!phone()) requestAnimationFrame(() => $('.chan[data-i]', D.bank)?.focus({ preventScroll: true }));
}
function exitGroup() {
  const back = S.group ?? 0;
  S.group = null; S.item = back;
  buildBank(); paint();
  strike(D.raster, D.flash);
  syncBack();
  setHash(bankAt()?.id, itemNow()?.ref);
  if (!phone()) requestAnimationFrame(() => D.bank.querySelector(`.chan[data-i="${back}"]`)?.focus({ preventScroll: true }));
}

/* ── Deep links: #bank or #bank/REF ──────────────────────────────── */
let hashLock = false;
function setHash(bank, ref) {
  hashLock = true;
  const h = bank ? '#' + bank + (ref ? '/' + ref : '') : ' ';
  history.replaceState(null, '', h === ' ' ? location.pathname + location.search : h);
  requestAnimationFrame(() => { hashLock = false; });
}
function route() {
  const [bankId, ref] = decodeURIComponent(location.hash.slice(1)).split('/');
  const bi = CFG.banks.findIndex(b => b.id === bankId);
  if (bi < 0) { goHome({ focus: false }); return; }
  openBank(bi, { focus: false });
  if (!ref) return;
  const top = CFG.banks[bi].items;
  let gi = null, ii = top.findIndex(x => x.ref === ref);
  if (ii < 0) top.forEach((x, k) => {
    if (x.group) { const j = x.items.findIndex(y => y.ref === ref); if (j >= 0) { gi = k; ii = j; } }
  });
  if (ii < 0) return;
  if (gi != null) { S.group = gi; }
  S.item = ii; buildBank(); paint();
  /* The hash named a channel, so show it rather than the list. */
  if (phone()) setStage('detail');
}
addEventListener('hashchange', () => { if (!hashLock) route(); });

/* ═══ INPUT ═════════════════════════════════════════════════════════ */

D.keypad.addEventListener('click', e => {
  const k = e.target.closest('.key'); if (!k) return;
  clack(0.9, 1700, 0.07);
  replay(D.console, 'knock');
  openBank(+k.dataset.bank);
});
const aimHero = e => {
  const k = e.target.closest?.('.key');
  if (k) setHero(+k.dataset.bank);
};
D.keypad.addEventListener('pointerover', aimHero);
D.keypad.addEventListener('focusin', aimHero);
D.keypad.addEventListener('pointerleave', () => setHero(null));
D.keypad.addEventListener('focusout', e => {
  if (!D.keypad.contains(e.relatedTarget)) setHero(null);
});

D.bank.addEventListener('click', e => {
  const c = e.target.closest('.chan[data-i]'); if (!c) return;
  const i = +c.dataset.i;
  if (listNow()[i]?.group) { clack(0.8, 1500, 0.06); enterGroup(i); return; }
  selectItem(i);
  /* On the desktop the readout is already on screen beside the list, so
     selecting is the whole interaction. On a phone it is the next
     stage, and the tube striking is what marks the move. */
  if (phone()) {
    openDetail();
  }
});

/* Nothing to open any more — the readout is already up. This keeps the
   name for the search and deep-link paths that call it. */
function openDetail() {
  setStage('detail');
  strike(D.raster, D.flash);
  D.panel.scrollTop = 0;
  requestAnimationFrame(() => { markCards(); centreCard(false); });
}

/* Stepping a channel from the pager keeps the reader at the top of the
   new text — carrying the old scroll position over drops them into the
   middle of a description they have not started. */
function step(dir) {
  /* Paging the list follows the readout, so returning to the list
     never lands on a page that does not contain the current channel. */
  const items = listNow();
  const next = S.item + dir;
  if (next < 0 || next >= items.length) return;
  selectItem(next, { focus: false, scroll: false });
  strike(D.raster, D.flash);
  D.panel.scrollTop = 0;
}
addEventListener('resize', () => requestAnimationFrame(() => centreCard(false)));
D.pgPrev.addEventListener('click', () => { clack(0.6, 1900, 0.05); step(-1); });
D.pgNext.addEventListener('click', () => { clack(0.6, 1900, 0.05); step(1); });

D.back.addEventListener('click', () => {
  clack(0.7, 1500, 0.06);
  /* Inside a folder, back climbs out of it rather than all the way
     home — otherwise seventeen consoles are two taps from anywhere
     and one tap from nowhere. */
  if (phone() && S.group != null) {
    const g = S.group;
    S.group = null; S.item = g;
    buildBank(); paint();
    strike(D.raster, D.flash);
    setHash(bankAt()?.id, itemNow()?.ref);
    syncBack();
    return;
  }
  goHome();
});

/* ── Swipe the readout to change channel ────────────────────────────
   On a phone the selector rail is a horizontal strip above a large
   readout, and reaching back up to it for every item is the main cost
   of that layout. A horizontal drag across the readout does the same
   thing. The axis is locked on the first 10px of movement so a swipe
   can never steal a vertical scroll of the detail text, and mouse
   pointers are ignored entirely — this is a touch affordance, and on
   a desktop the arrow keys already do it. */
(() => {
  const el = $('#tube');
  if (!el) return;
  let id = null, x0 = 0, y0 = 0, axis = null;

  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || id !== null) return;
    id = e.pointerId; x0 = e.clientX; y0 = e.clientY; axis = null;
  }, { passive: true });

  el.addEventListener('pointermove', e => {
    if (e.pointerId !== id || axis) return;
    const dx = Math.abs(e.clientX - x0), dy = Math.abs(e.clientY - y0);
    if (dx > 10 || dy > 10) axis = dx > dy ? 'x' : 'y';
  }, { passive: true });

  const end = e => {
    if (e.pointerId !== id) return;
    const dx = e.clientX - x0;
    id = null;
    if (axis !== 'x' || Math.abs(dx) < 52) return;
    if (phone() && D.cat.dataset.stage !== 'detail') return;
    if (listNow().length < 2) return;
    step(dx < 0 ? 1 : -1);
  };
  el.addEventListener('pointerup', end, { passive: true });
  el.addEventListener('pointercancel', e => { if (e.pointerId === id) id = null; }, { passive: true });
})();

D.commit.addEventListener('click', () => {
  const it = itemNow(); if (!it) return;
  if (it.group) { enterGroup(S.item); return; }
  if (S.busy) return;
  S.busy = true;
  D.commit.setAttribute('data-busy', '');
  replay(D.console, 'knock');
  clack(1, 1200, 0.09);
  setState('busy', CFG.ui.state.busy);
  strike(D.raster, D.flash);
  /* Still dispatched, so a booking system can be hung off it later. */
  document.dispatchEvent(new CustomEvent('console:request', {
    detail: { bank: bankAt()?.id, ref: it.ref, name: it.name, rate: it.rate }
  }));
  setTimeout(() => {
    setState('done', CFG.ui.state.done);
    openCard({ ref: it.ref, name: it.name, rate: it.rate });
  }, 380);
  setTimeout(() => {
    S.busy = false;
    D.commit.removeAttribute('data-busy');
    setState('idle', CFG.ui.state.idle);
  }, 3400);
});

/* ── Contact card ───────────────────────────────────────────────────
   Built with createElement/textContent, like every other list here, so
   nothing from CFG is ever parsed as markup. */
function copyValue(btn, text) {
  const C = CFG.contact;
  const settle = () => {
    btn.textContent = C.copiedLabel;
    btn.setAttribute('data-ok', '');
    say(`${C.copiedLabel}. ${text}`);
    clearTimeout(btn._t);
    btn._t = setTimeout(() => {
      btn.textContent = C.copyLabel;
      btn.removeAttribute('data-ok');
    }, 1500);
  };
  /* execCommand is deprecated but it is the only path that works on a
     page served over plain http, which a locally-opened file is. */
  const fallback = () => {
    const t = mk('textarea');
    t.value = text;
    t.setAttribute('readonly', '');
    t.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(t);
    t.select();
    try { document.execCommand('copy'); settle(); } catch { btn.textContent = C.copyLabel; }
    t.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(settle, fallback);
  } else fallback();
}

const GO_ICON = '<path d="M7 17 17 7"/><path d="M8 7h9v9"/>';

/* One row grammar for every channel: the body is the action, the chip
   on the right copies. Rows that lead somewhere are lit and carry the
   departure arrow; rows that are only a string to copy stay recessed.
   Built with createElement/textContent, like every other list here, so
   nothing from CFG is ever parsed as markup. */
function buildRows(host, list, primary, subject) {
  const C = CFG.contact;
  host.textContent = '';
  host.hidden = !list.length;
  list.forEach(r => {
    const row = mk('div', 'row' + (primary ? ' is-primary' : ''));

    const main = mk(r.href ? 'a' : 'div', 'row-main');
    if (r.href) {
      /* A mail client that opens with the subject already filled in is
         the difference between a lead and an abandoned draft. */
      main.href = (subject && /^mailto:/i.test(r.href))
        ? `${r.href}?subject=${encodeURIComponent(subject)}`
        : r.href;
      if (/^https?:/i.test(r.href)) { main.target = '_blank'; main.rel = 'noopener noreferrer'; }
    }
    main.appendChild(svgIcon(r.icon || '', 'row-icon'));

    const text = mk('span', 'row-text');
    text.appendChild(mk('span', 'row-label', r.label));
    text.appendChild(mk('span', 'row-value', r.value));
    main.appendChild(text);

    if (r.href) main.appendChild(svgIcon(GO_ICON, 'row-go'));
    row.appendChild(main);

    const b = mk('button', 'row-copy', C.copyLabel);
    b.type = 'button';
    b.setAttribute('aria-label', `${C.copyLabel} — ${r.label}`);
    b.addEventListener('click', () => copyValue(b, r.value));
    row.appendChild(b);

    host.appendChild(row);
  });
}

/* ═══ DOCK ══════════════════════════════════════════════════════════
   Built from CFG.contact.channels rather than its own copy of the
   number, so the phone and address stay in exactly one place in this
   file. A key whose channel is missing simply is not rendered.
   ══════════════════════════════════════════════════════════════════ */
const STAR_PATH = 'm12 2.6 2.9 6 6.6.9-4.8 4.6 1.2 6.5-5.9-3.2-5.9 3.2 1.2-6.5L2.5 9.5l6.6-.9Z';
function stars(cls) {
  const w = mk('span', cls);
  w.setAttribute('aria-hidden', 'true');
  for (let i = 0; i < 5; i++) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    const pth = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    pth.setAttribute('d', STAR_PATH);
    s.appendChild(pth); w.appendChild(s);
  }
  return w;
}

function buildWhy() {
  const W = CFG.ui.why;
  $('#why-name').textContent = W.title;
  const body = $('#why-body');
  body.textContent = '';
  W.body.forEach(p => body.appendChild(mk('p', 'card-sub', p)));

  const host = $('#why-stats');
  host.textContent = '';
  W.stats.forEach(s => {
    const tile = mk('div', 'stat');
    const top = mk('div', 'stat-top');
    top.appendChild(svgIcon(s.icon, 'stat-ico'));
    if (s.stars) top.appendChild(stars('stat-stars'));
    tile.appendChild(top);
    tile.appendChild(mk('span', 'stat-n', s.n));
    tile.appendChild(mk('span', 'stat-l', s.l));
    /* The stars are decorative in the tile, so the rating has to reach
       a screen reader some other way. */
    tile.setAttribute('role', 'group');
    tile.setAttribute('aria-label', `${s.n} ${s.l}${s.stars ? ', five star rating' : ''}`);
    host.appendChild(tile);
  });
  $('#why-foot').textContent = W.foot;
}

let whyOpener = null;
function openWhy() {
  whyOpener = document.activeElement;
  D.whyCard.showModal();
  strike($('#why-raster'), $('#why-flash'));
  say('Why choose me. ' + CFG.ui.why.title);
}
D.btnWhy.addEventListener('click', () => { clack(0.85, 1500, 0.07); openWhy(); });
$('#why-close').addEventListener('click', () => { clack(0.7, 2000, 0.05); D.whyCard.close(); });
D.whyCard.addEventListener('close', () => {
  const back = (whyOpener && whyOpener.isConnected && whyOpener.offsetParent) ? whyOpener : D.btnWhy;
  back.focus({ preventScroll: true });
  whyOpener = null;
});
/* Clicking the backdrop closes, matching the contact card. */
D.whyCard.addEventListener('click', e => { if (e.target === D.whyCard) D.whyCard.close(); });

function buildDock() {
  const C = CFG.contact;
  D.dock.textContent = '';
  (CFG.ui.dock || []).forEach(k => {
    const ch = k.use ? C.channels.find(x => x.label === k.use) : null;
    if (k.use && !(ch && ch.href)) return;

    const el = mk(k.card ? 'button' : 'a', 'dockey');
    if (k.card) {
      el.type = 'button';
      el.addEventListener('click', () => openCard(null));
      el.setAttribute('aria-haspopup', 'dialog');
      el.setAttribute('aria-label', `${k.label} — all contact channels`);
    } else {
      /* sms: and tel: are the same digits; deriving one from the other
         means a changed number cannot go half-updated. */
      el.href = k.sms ? ch.href.replace(/^tel:/i, 'sms:') : ch.href;
      el.setAttribute('aria-label', `${k.label} ${ch.value}`);
    }
    el.style.setProperty('--c', k.lamp);
    el.appendChild(svgIcon(k.icon, 'dockey-ico'));
    el.appendChild(mk('span', null, k.label));
    D.dock.appendChild(el);
  });
}

function buildCard(req) {
  const c = CFG.contact;
  $('#card-headline').textContent    = c.headLabel;
  $('#card-reg').textContent         = c.reg;
  $('#card-kicker').textContent      = c.kicker;
  $('#card-name').textContent        = c.name;
  $('#card-sub').textContent         = c.station;
  $('#card-note').textContent        = c.note;
  $('#card-hours-value').textContent = c.hours;

  const line = req
    ? `${req.ref} — ${req.name}${req.rate ? ' · ' + req.rate : ''}`
    : '';
  $('#card-req').hidden = !req;
  $('#card-req-label').textContent = c.reqLabel;
  $('#card-req-name').textContent  = line;

  const primary = c.channels.filter(x => x.primary);
  const rest    = c.channels.filter(x => !x.primary);
  const subject = req ? `${c.subject} ${line}` : '';

  buildRows($('#card-primary'), primary, true, subject);
  buildRows($('#card-rest'), rest, false);

  const sec = (el, label, on) => { el.textContent = label; el.hidden = !on; };
  sec($('#card-sec-primary'), c.sections.primary, primary.length);
  sec($('#card-sec-rest'),    c.sections.handles, rest.length);
  sec($('#card-sec-hours'),   c.sections.hours,   !!c.hours);
  $('#card-hours-value').closest('.card-hours').hidden = !c.hours;
}

let cardOpener = null;
function openCard(req) {
  cardOpener = document.activeElement;
  buildCard(req || null);
  clack(0.8, 1500, 0.06);
  replay(D.console, 'knock');
  if (typeof D.card.showModal === 'function') D.card.showModal();
  else D.card.setAttribute('open', '');
  D.card.style.transform = '';
  /* The card powers on exactly like the console does. */
  strike(D.cardRaster, D.cardFlash);
  bloom(D.cardFace);
  D.cardFace.scrollTop = 0;
  requestAnimationFrame(() => D.cardFace.focus({ preventScroll: true }));
  say(req
    ? `${CFG.contact.reqLabel} ${req.name}. ${CFG.contact.headLabel}. ${CFG.contact.name}.`
    : `${CFG.contact.headLabel}. ${CFG.contact.name}. ${CFG.contact.station}.`);
}

D.btnContact.addEventListener('click', () => openCard(null));
$('#card-close').addEventListener('click', () => D.card.close());
/* Clicking the backdrop targets the dialog itself, not its contents. */
D.card.addEventListener('click', e => { if (e.target === D.card) D.card.close(); });
D.card.addEventListener('close', () => {
  D.card.classList.remove('is-dragging');
  D.card.style.transform = '';
  /* offsetParent is null for a display:none ancestor, which is exactly
     the case the old unconditional focus fell into on a phone. */
  const back = (cardOpener && cardOpener.isConnected && cardOpener.offsetParent)
    ? cardOpener : (D.btnContact.offsetParent ? D.btnContact : D.find);
  back.focus({ preventScroll: true });
  cardOpener = null;
});

/* ── Sheet drag ─────────────────────────────────────────────────────
   Phones get the card as a bottom sheet, so it should throw away like
   one. Only the bezel head is a handle — the screen below it scrolls,
   and a sheet that also drags from its scroll area fights the reader
   on every flick. touch-action:none on .card-head keeps the browser
   from claiming the gesture first. */
(() => {
  let id = null, y0 = 0, dy = 0, t0 = 0;
  const sheet = () => MQ_PHONE.matches;

  D.cardHead.addEventListener('pointerdown', e => {
    if (!sheet() || id !== null) return;
    id = e.pointerId; y0 = e.clientY; dy = 0; t0 = performance.now();
    D.cardHead.setPointerCapture(id);
    D.card.classList.add('is-dragging');
  });

  D.cardHead.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    dy = Math.max(0, e.clientY - y0);            // down only
    D.card.style.transform = `translateY(${dy.toFixed(1)}px)`;
  });

  const release = e => {
    if (e.pointerId !== id) return;
    id = null;
    D.card.classList.remove('is-dragging');
    D.card.style.transform = '';
    const fast = dy > 40 && (performance.now() - t0) < 300;
    if (dy > D.card.offsetHeight * 0.28 || fast) D.card.close();
  };
  D.cardHead.addEventListener('pointerup', release);
  D.cardHead.addEventListener('pointercancel', release);
})();

D.pwr.addEventListener('click', () => setAudio(!S.audio));

addEventListener('keydown', e => {
  if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
  /* The dialog owns the keyboard while it is open: <dialog> handles Esc
     itself, and 1–4 must not navigate the console behind the card. */
  if (D.card.open) return;
  if (!S.booted) { finishBoot(); return; }

  /* The finder owns the keyboard while it has focus — otherwise typing
     "ps3" fires the bank-3 shortcut mid-word. */
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || '');
  if (typing) return;

  /* Slash jumps to the finder from anywhere, including inside a bank —
     which is the fastest route from one service to an unrelated one. */
  if (e.key === '/' && !D.results.contains(document.activeElement)) {
    e.preventDefault();
    if (!D.home.hasAttribute('data-active')) goHome({ focus: false });
    requestAnimationFrame(() => D.find.focus());
    return;
  }

  if (/^[1-9]$/.test(e.key) && CFG.banks[+e.key - 1]) {
    e.preventDefault(); clack(0.9, 1700, 0.07); openBank(+e.key - 1); return;
  }
  if (!D.cat.hasAttribute('data-active')) {
    if (e.key === 'Escape' && D.find.value) { e.preventDefault(); clearFind(); }
    return;
  }

  if (e.key === 'Escape') {
    e.preventDefault();
    if (phone() && D.cat.dataset.stage === 'detail') { setStage('list'); return; }
    if (S.group != null) exitGroup(); else goHome();
    return;
  }
  const inBank = D.bank.contains(document.activeElement) ||
                 document.activeElement === document.body ||
                 document.activeElement === D.panel;
  if (!inBank) return;

  const items = listNow();
  switch (e.key) {
    case 'ArrowDown': case 'ArrowRight':
      e.preventDefault(); selectItem(S.item + 1, { focus: true }); break;
    case 'ArrowUp': case 'ArrowLeft':
      e.preventDefault(); selectItem(S.item - 1, { focus: true }); break;
    case 'Home':
      e.preventDefault(); selectItem(0, { focus: true }); break;
    case 'End':
      e.preventDefault(); selectItem(items.length - 1, { focus: true }); break;
    case 'Enter': case ' ':
      if (items[S.item]?.group && D.bank.contains(document.activeElement)) return; // button handles it
      if (items[S.item]?.group) { e.preventDefault(); enterGroup(S.item); }
      break;
  }
});

/* ═══ TELEMETRY ═════════════════════════════════════════════════════ */

function startClock() {
  const draw = () => {
    if (document.hidden) return;
    const d = new Date();
    D.clock.textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
  };
  draw(); setInterval(draw, 1000);
}
function startMeter() {
  const bars = [...D.meter.children];
  const draw = () => {
    if (document.hidden) return;
    const strength = 2 + Math.floor(Math.random() * 4);
    bars.forEach((b, i) => {
      b.style.height = (4 + i * 2.2) + 'px';
      b.classList.toggle('on', i < strength);
    });
  };
  draw(); setInterval(draw, 1400);
}

/* ═══ BOOT ══════════════════════════════════════════════════════════ */

/* ═══ COLD START ════════════════════════════════════════════════════
   The self-test reports the real catalogue. Bank counts, the index
   total and the operator name are read from CFG, not typed in — so a
   service added to the list turns up in the boot screen too, and the
   sequence can never claim something the console does not have. That
   is the whole difference between an instrument reporting itself and
   an intro animation with numbers painted on it. ═════════════════ */

const COLD = { fil: 130, open: 760, scanEnd: 1985, deg: 2205, end: 2470, hint: 900 };
let cold = null;

function coldReport() {
  const COLS = 42;
  /* Leader dots to a fixed width, so the OK column lines up down the
     whole report the way a printed test sheet does. */
  const row = (l, r) => l + ' ' + '.'.repeat(Math.max(2, COLS - l.length - r.length - 2)) + ' ' + r;
  const chk = (l, v) => row(l, v.padEnd(10) + 'OK');
  const total = CFG.banks.reduce((n, b) => n + services(b), 0);
  const L = [
    { t: CFG.brand.model, hot: true },
    { t: 'OPERATOR CONSOLE MK-II'.padEnd(COLS - (CFG.ui.serial + ' ' + CFG.brand.serial).length)
         + CFG.ui.serial.toUpperCase() + ' ' + CFG.brand.serial, dim: true },
    { t: '' },
    { t: chk('HEATER', '6.3V') },
    { t: chk('HIGH TENSION', '18.5KV') },
    { t: chk('DEFLECTION', 'LOCKED') },
    { t: chk('PHOSPHOR', 'P3 AMBER') },
    { t: '' }
  ];
  CFG.banks.forEach((b, i) =>
    L.push({ t: row(`BANK ${pad2(i + 1)}  ${b.name.toUpperCase()}`, `${pad2(services(b))} CH`), lamp: i }));
  L.push({ t: '' });
  L.push({ t: chk('INDEX', `${total} SVC`) });
  L.push({ t: row('OPERATOR', CFG.contact.name.toUpperCase()) });
  L.push({ t: row('STATION', 'SOUTH FLORIDA + ONLINE') });
  L.push({ t: '' });
  L.push({ t: 'READY', hot: true, ready: true });
  return L;
}

function coldSupported() {
  try { return !!document.createElement('canvas').getContext('2d'); }
  catch { return false; }
}

function coldEnd(now) {
  if (!cold) return;
  cancelAnimationFrame(cold.raf);
  const el = cold.el;
  cold = null;
  D.chassis.removeAttribute('data-cold');
  if (now) { el.remove(); return; }
  el.setAttribute('data-out', '');
  setTimeout(() => el.remove(), 520);
}

function coldStart() {
  const el     = mk('div', 'cold');
  const raster = mk('div', 'cold-raster');
  const shake  = mk('div', 'cold-shake');
  const cvs    = mk('canvas', 'cold-canvas');
  const flash  = mk('div', 'tube-flash');
  const hint   = mk('div', 'cold-hint',
    matchMedia('(hover: none)').matches ? 'Tap to skip' : 'Press any key to skip');

  el.setAttribute('aria-hidden', 'true');
  shake.append(cvs, mk('div', 'cold-fil'), mk('div', 'cold-line'));
  raster.appendChild(shake);
  el.append(raster, mk('div', 'tube-sweep'), mk('div', 'tube-glass'), flash, hint);
  D.chassis.insertBefore(el, D.chassis.querySelector('.base'));
  D.chassis.setAttribute('data-cold', '');

  /* alpha:false lets the compositor treat the surface as opaque, which
     is what makes a full-face fill per frame cheap enough to be the
     decay model. */
  const ctx = cvs.getContext('2d', { alpha: false });
  const lines = coldReport();

  let W = 0, H = 0, DP = 1, lh = 20, rows = [], target = null, tctx = null, degauss = false;

  function build() {
    const r = el.getBoundingClientRect();
    DP = Math.min(devicePixelRatio || 1, 2);
    W = Math.max(2, Math.round(r.width  * DP));
    H = Math.max(2, Math.round(r.height * DP));
    cvs.width = W; cvs.height = H;

    /* Width sets the type size, height sets the leading. A report that
       fitted the width but not the height left the beam scanning empty
       space for a third of its travel, which reads as a stall. */
    const COLS = 42;
    const fs = Math.max(8.5, Math.min(21, (r.width * 0.9) / COLS / 0.601)) * DP;
    lh = clamp((H * 0.72) / lines.length, fs * 1.45, fs * 2.7);

    if (!target) { target = document.createElement('canvas'); tctx = target.getContext('2d'); }
    target.width = W; target.height = H;
    tctx.clearRect(0, 0, W, H);
    tctx.font = `500 ${fs.toFixed(2)}px "IBM Plex Mono", ui-monospace, monospace`;
    tctx.textBaseline = 'alphabetic';

    const chW = tctx.measureText('0').width || fs * 0.6;
    const x0 = Math.round((W - chW * COLS) / 2);
    const top = Math.round((H - lines.length * lh) / 2);

    /* The halo is baked into the target rather than blurred per frame.
       Mono type at 14px is one or two anti-aliased pixels per stroke,
       and a beam depositing a fraction of that per frame never lifts a
       half-covered pixel to a readable level — the first build of this
       scanned beautifully and could not be read. Pre-glowing the plate
       gives the deposit something with real coverage to work with, and
       costs one draw instead of sixty. */
    rows = lines.map((L, i) => {
      const y0 = top + i * lh;
      const base = y0 + lh * 0.76;
      if (L.t) {
        const col = L.hot ? '#fff3dc' : L.dim ? '#c07d24' : '#ffb347';
        tctx.fillStyle = col;
        tctx.shadowColor = 'rgba(255,150,52,.9)';
        tctx.shadowBlur = fs * 0.3;
        for (let q = 0; q < 4; q++) tctx.fillText(L.t, x0, base);
        tctx.shadowBlur = 0;
        for (let q = 0; q < 3; q++) tctx.fillText(L.t, x0, base);
        /* The pass state is the only thing anyone scans a test sheet
           for, so it is the one token drawn at full beam. */
        const k = L.t.lastIndexOf('OK');
        if (k > 0) {
          tctx.fillStyle = '#fff9ee';
          tctx.fillText('OK', x0 + k * chW, base);
          tctx.fillText('OK', x0 + k * chW, base);
        }
      }
      return { y: base, top: y0, lamp: L.lamp, ready: !!L.ready, done: false };
    });

    ctx.fillStyle = '#070502';
    ctx.fillRect(0, 0, W, H);
  }

  build();
  const onResize = () => { if (cold) build(); };
  addEventListener('resize', onResize, { passive: true });

  const ready = rows.find(r => r.ready);
  let t0 = 0;

  function frame(t) {
    if (!cold) return;
    if (!t0) t0 = t;
    const e = t - t0;

    if (e > COLD.hint) el.setAttribute('data-hint', '');

    if (e >= COLD.end) {
      removeEventListener('resize', onResize);
      coldEnd(false);
      finishBoot();
      return;
    }

    if (e >= COLD.open) {
      /* Slow first field. A real tube reaches rate too fast to watch,
         so this one is deliberately under rate for its first frame —
         which is the only honest way to SHOW a raster being written. */
      const p = clamp((e - COLD.open) / (COLD.scanEnd - COLD.open), 0, 1);
      const y = (H + lh * 2) * (1 - Math.pow(1 - p, 1.35)) - lh;
      const yn = clamp(y, 0, H);

      /* Decay pulls the whole face toward black; the maintenance pass
         puts back slightly more than was lost, so the scanned region
         settles at a steady readable level instead of either fading
         out or blowing up. The ratio between these two numbers is the
         only thing controlling how long the trail behind the beam is,
         and it was worth measuring rather than guessing. */
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(7,5,2,.16)';
      ctx.fillRect(0, 0, W, H);

      ctx.globalCompositeOperation = 'lighter';
      if (yn > 1) {
        ctx.globalAlpha = 0.2;
        ctx.drawImage(target, 0, 0, W, yn, 0, 0, W, yn);
      }

      if (p < 1) {
        const hb = Math.max(2, lh * 0.95);
        const hy = Math.max(0, yn - hb);
        const hh = Math.min(hb, H - hy);
        if (hh > 0) {
          /* The head deposits far more than the maintenance pass, so
             the rows just behind the beam are hot and decay into the
             steady level — that gradient IS the persistence trail. */
          ctx.globalAlpha = 0.55;
          ctx.drawImage(target, 0, hy, W, hh, 0, hy, W, hh);
        }
        const g = ctx.createLinearGradient(0, yn - hb, 0, yn + hb * 0.4);
        g.addColorStop(0.00, 'rgba(255,140,40,0)');
        g.addColorStop(0.66, 'rgba(255,178,78,.2)');
        g.addColorStop(0.93, 'rgba(255,236,204,.62)');
        g.addColorStop(1.00, 'rgba(255,150,50,0)');
        ctx.globalAlpha = 1;
        ctx.fillStyle = g;
        ctx.fillRect(0, yn - hb, W, hb * 1.4);
        ctx.fillStyle = 'rgba(255,250,238,.95)';
        /* Sub-pixel deflection noise: without it the beam is a ruler,
           and a ruler is the one thing a deflection yoke is not. */
        ctx.fillRect((Math.random() - 0.5) * 0.9 * DP, yn - DP, W, 1.7 * DP);

        rows.forEach(r => {
          if (r.lamp == null || r.done || yn < r.y) return;
          r.done = true;
          D.lamps.children[r.lamp]?.classList.add('lit');
          clack(0.38, 2400 + r.lamp * 130, 0.03);
        });
      } else if (ready) {
        /* READY is the one line that keeps being re-struck, so it is
           the one line that pulses. */
        ctx.globalAlpha = 0.22 + 0.42 * (Math.sin((e - COLD.scanEnd) / 108) * 0.5 + 0.5);
        ctx.drawImage(target, 0, ready.top, W, lh, 0, ready.top, W, lh);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    if (e >= COLD.deg) {
      if (!degauss) {
        degauss = true;
        replay(flash, 'firing');
        replay(D.console, 'knock');
        clack(1, 900, 0.13);
      }
      const q = (e - COLD.deg) / (COLD.end - COLD.deg);
      const a = (1 - q) * (1 - q) * 10;
      shake.style.transform =
        `translateY(${(Math.sin(q * 38) * a).toFixed(2)}px)` +
        ` skewX(${(Math.sin(q * 29) * a * 0.09).toFixed(3)}deg)` +
        ` scaleX(${(1 + Math.sin(q * 21) * a * 0.0016).toFixed(4)})`;
    }

    cold.raf = requestAnimationFrame(frame);
  }

  cold = { el, raf: requestAnimationFrame(frame) };
}

let bootTimers = [];
function finishBoot() {
  if (S.booted) return;
  coldEnd(true);
  bootTimers.forEach(clearTimeout); bootTimers = [];
  S.booted = true;
  D.chassis.removeAttribute('data-boot');
  lampSet(null);
  setHero(null);
  strike(D.heroRaster, D.heroFlash);
  route();
  scheduleSlip();
}

function boot() {
  D.brandName.textContent  = CFG.brand.name;
  D.brandModel.textContent = CFG.brand.model;
  D.serial.textContent     = `${CFG.ui.serial} ${CFG.brand.serial}`;
  D.commitLabel.textContent = CFG.commit;
  buildLamps(); buildKeypad(); buildDock(); buildCard(); buildWhy(); startClock(); startMeter();
  renderResults('');
  deckHome.set(1, 0); deckBank.set(1, 0);

  /* A deep link is a request for a service, not for a title sequence. */
  if (calm() || location.hash) { finishBoot(); return; }

  D.heroKicker.textContent = CFG.ui.boot;
  D.heroLine.textContent = '\u00A0';
  D.heroNote.textContent = '\u00A0';

  /* Once per session. The full power-on is worth two and a half
     seconds the first time somebody meets the machine; it is worth
     none of them on the fourth page view, and a sequence you cannot
     get past is just a toll. Storage is wrapped because a file:// or
     partitioned context throws on access rather than returning null. */
  let seen = false;
  try {
    seen = sessionStorage.getItem('jb-cold') === '1';
    sessionStorage.setItem('jb-cold', '1');
  } catch { /* no storage: play it, it is only 2.5s */ }

  if (!seen && coldSupported()) { coldStart(); return; }

  const at = (ms, fn) => bootTimers.push(setTimeout(fn, ms));
  CFG.banks.forEach((_, i) =>
    at(140 + i * 110, () => {
      D.lamps.children[i]?.classList.add('lit');
      clack(0.4, 2600, 0.03);
    }));
  at(560, () => { D.heroKicker.textContent = CFG.home.kicker; });
  at(720, finishBoot);
}

document.addEventListener('pointerdown', () => { if (!S.booted) finishBoot(); }, { once: true });
document.addEventListener('visibilitychange', () => { if (document.hidden) restTilt(); });

boot();
})();
</script>
